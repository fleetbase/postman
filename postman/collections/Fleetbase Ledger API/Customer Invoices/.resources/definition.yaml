$kind: collection
description: |-
  Customer invoice endpoints let a signed-in customer (for example a rider in a Fleet-Ops passenger app) find the Ledger invoice for their own order, then view and pay it through the Public Invoices endpoints. Ledger v0.1.0 and later.

  Requests send the organization's API key as the bearer token and the customer's Fleet-Ops token in the `Customer-Token` header.
order: 1500
