$kind: http-request
description: |-
  Expires the key this app minted in the token's organization for one installation (or the app-wide key without `installation`), without touching the grant or other installations' keys. Idempotent: `204` with no body whether or not there was a key. Needs `api-key:create`.

  Errors: `400` `invalid_request` for a bad `installation`, `401` `invalid_token`, `403` `insufficient_scope`. Throttled to 600 requests a minute. Without `oauth_access_token`, asserts the `401`.
url: "{{base_url}}/oauth/v1/api-key"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{oauth_access_token}}"
queryParams:
  installation: "{{oauth_installation}}"
scripts:
  - type: beforeRequest
    code: |-
      // An access token only exists after a browser sign-in (see Authorize).
      if (!pm.variables.get('oauth_access_token')) {
          pm.variables.set('expected_status', 401);
      }
    language: text/javascript
order: 14000
