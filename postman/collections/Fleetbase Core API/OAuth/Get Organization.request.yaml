$kind: http-request
description: |-
  The organization the access token is bound to, the one the user picked on the consent screen (never their current organization in the console). Needs `organization:read`.

  Response (`Cache-Control: no-store`): `{ "organization": { id, name, logo_url, currency, country, timezone, website_url } }`, where `id` is the organization's public ID.

  Errors: `401` `invalid_token` (also when the user no longer administers the organization, which revokes the grant), `403` `insufficient_scope`. Throttled to 600 requests a minute. Without `oauth_access_token`, asserts the `401`.
url: "{{base_url}}/oauth/v1/organization"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{oauth_access_token}}"
scripts:
  - type: beforeRequest
    code: |-
      // An access token only exists after a browser sign-in (see Authorize).
      if (!pm.variables.get('oauth_access_token')) {
          pm.variables.set('expected_status', 401);
      }
    language: text/javascript
order: 9000
