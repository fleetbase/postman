$kind: http-request
description: |-
  Turns App Review sign-in off for the subject (see Get Review Access for `type`, `id` and scopes) and answers with the status. The code is kept, so turning access on again restores it.

  Errors: as Get Review Access.
url: "{{base_url}}/oauth/v1/review-access/:type/:id"
method: DELETE
pathVariables:
  - key: type
    value: "{{oauth_review_access_type}}"
  - key: id
    value: "{{oauth_review_access_id}}"
auth:
  type: bearer
  credentials:
    token: "{{oauth_access_token}}"
scripts:
  - type: beforeRequest
    code: |-
      // Without an id the path has an empty segment and no route matches, so address a
      // placeholder instead: the token is then checked (401 without one) and the
      // placeholder answers the not-found contract. It is a run-wide local variable, so
      // the next review-access request sees it and follows.
      const missing = ['', undefined, null, 'review_access_missing'].includes(pm.variables.get('oauth_review_access_id'));
      if (missing) {
          pm.variables.set('oauth_review_access_id', 'review_access_missing');
      }
      if (!pm.variables.get('oauth_access_token')) {
          pm.variables.set('expected_status', 401);
      } else if (missing) {
          pm.variables.set('expected_status', 404);
      }
    language: text/javascript
order: 13000
