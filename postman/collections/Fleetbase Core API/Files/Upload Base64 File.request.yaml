$kind: http-request
description: |-
  Creates a file from base64-encoded data. Fleetbase stores the decoded file, creates a file record, and optionally associates it with a subject resource.
url: "{{base_url}}/{{namespace}}/files/base64"
method: POST
body:
  type: json
  content: |-
    {
      "data": "{{base64_file_data}}",
      "file_name": "example.png",
      "file_type": "image",
      "content_type": "image/png",
      "path": "uploads"
    }

scripts:
  - type: afterResponse
    code: |
      var json_response = pm.response.json();
      let cv = pm.environment;
      cv.set("file_id", json_response.id);
    language: text/javascript
order: 2000
