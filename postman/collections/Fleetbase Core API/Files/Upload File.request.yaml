$kind: http-request
description: |-
  Uploads a multipart file and creates a file record. The response includes the stored file URL and metadata captured from the upload.
url: "{{base_url}}/{{namespace}}/files"
method: POST
body:
  type: formdata
  content:
    - type: file
      key: file
      # Path is resolved against the CLI's process working directory, and --working-dir
      # does not change that — so it is written relative to the repo root, which is where
      # you run the collection from.
      src: "postman/collections/Fleetbase Core API/Files/sample-upload.png"
    - type: text
      key: path
      value: "uploads"
    - type: text
      key: type
      value: "attachment"

order: 1000
