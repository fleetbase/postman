$kind: http-request
description: |-
  Replaces the endpoint's signing secret and answers with the endpoint including the new `secret`. Deliveries dispatched from now on are signed with the new secret (retries of a delivery dispatched earlier keep the signature it was sent with), so update the receiver straight away. An endpoint created before per-endpoint secrets existed gets its secret on its first rotation or delivery.

  Errors: `404` (`Webhook endpoint not found.`).
url: "{{base_url}}/{{namespace}}/webhook-endpoints/:id/rotate-secret"
method: POST
pathVariables:
  - key: id
    value: "{{webhook_endpoint_id}}"

scripts:
  - type: afterResponse
    code: |
      var json_response = pm.response.json();

      pm.test('The rotated secret is returned', function () {
          pm.expect(json_response.secret, 'secret missing').to.be.a('string').and.match(/^whsec_/);
      });
    language: text/javascript
order: 5000
