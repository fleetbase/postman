$kind: http-request
description: |-
  Creates a comment on a subject resource or as a reply to an existing comment. Provide either a subject reference or a parent comment ID with the comment content.
url: "{{base_url}}/{{namespace}}/comments"
method: POST
body:
  type: json
  content: |-
    {
      "content": "Example comment",
      "subject": {
        "id": "{{organization_id}}",
        "type": "company"
      }
    }

scripts:
  - type: afterResponse
    code: |
      var json_response = pm.response.json();
      let cv = pm.environment;
      cv.set("comment_id", json_response.id);
    language: text/javascript
order: 1000
