$kind: http-request
description: |-
  Retrieves a comment by ID, including its author and any nested replies returned by the API resource. An internal comment returns `404` (`Comment resource not found.`), and internal replies are left out. Requires Core API with fleetbase/core-api#306 (release v1.6.69).
url: "{{base_url}}/{{namespace}}/comments/:id"
method: GET
pathVariables:
  - key: id
    value: "{{comment_id}}"

order: 4000
