$kind: http-request
description: |-
  Returns comments for the current organization. Use query parameters to filter, sort, and paginate the result set. Internal comments (`visibility` `internal`) and internal replies are left out. Requires Core API with fleetbase/core-api#306 (release v1.6.69).
url: "{{base_url}}/{{namespace}}/comments"
method: GET
queryParams:
  limit: "25"
  offset: "0"
  sort: "created_at"
order: 3000
