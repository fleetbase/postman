$kind: http-request
description: |-
  Adds a user in the current organization to an existing chat channel. The response returns the created chat participant resource.
url: "{{base_url}}/{{namespace}}/chat-channels/:id/add-participant"
method: POST
pathVariables:
  - key: id
    value: "{{chat_channel_id}}"

body:
  type: json
  content: |-
    {
      "user": "{{user_id}}"
    }

scripts:
  - type: afterResponse
    code: |
      var json_response = pm.response.json();
      let cv = pm.environment;
      cv.set("chat_participant_id", json_response.id);
    language: text/javascript
order: 8000