$kind: http-request
description: |-
  Sends a message to a chat channel as an existing chat participant. File IDs can be included to attach previously uploaded files to the message.
url: "{{base_url}}/{{namespace}}/chat-channels/:id/send-message"
method: POST
pathVariables:
  - key: id
    value: "{{chat_channel_id}}"

body:
  type: json
  content: |-
    {
      "sender": "{{chat_participant_id}}",
      "content": "Hello from Fleetbase API",
      "files": []
    }

scripts:
  - type: afterResponse
    code: |
      var json_response = pm.response.json();
      let cv = pm.environment;
      cv.set("chat_message_id", json_response.id);
    language: text/javascript
order: 3000