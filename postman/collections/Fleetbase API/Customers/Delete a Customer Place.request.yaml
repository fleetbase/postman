$kind: http-request
name: "Delete a Customer Place"
description: |-
  Deletes one of the authenticated customer's saved places. Answers `{ "status": "ok" }`, or `404` (`Place not found.`) for a place that isn't this customer's.

  Fleet-Ops v0.7.0 and later.
url: "{{base_url}}/{{namespace}}/customers/places/{{customer_place_id}}"
method: DELETE
headers:
  Accept: application/json
  Customer-Token: "{{customer_token}}"

order: 12500
