$kind: params
fields:
  - name: type
    type: string
    required: false
    description: Order config key (e.g. `transport`, `freight`). When omitted, the company's default OrderConfig is used.
  - name: order_config
    type: string
    required: false
    description: Explicit OrderConfig public id, overrides `type`.
  - name: scheduled_at
    type: timestamp
    required: false
    description: Requested fulfillment timestamp (ISO 8601).
  - name: notes
    type: string
    required: false
    description: Free-form notes / special handling instructions.
  - name: internal_id
    type: string
    required: false
    description: Optional caller-supplied identifier.
  - name: meta
    type: object
    required: false
    description: Free-form metadata stored on the order's `meta` column.
  - name: service_quote
    type: string
    required: false
    description: |-
      Optional ServiceQuote reference (uuid or `sqte_…` public_id) returned by `GET /v1/service-quotes`. When supplied, the controller resolves the quote via `ServiceQuote::resolveFromRequest` and consumes it via `$order->purchaseServiceQuote()` to lock the pricing onto the order's PurchaseRate (same behavior as `OrderController::create`). Since Fleet-Ops v0.7.0 it is required when the order config's `dispatch.matching.vehicle_type` or `customer.ordering.require_quote` policy is on, and a quote that has expired or belongs to another company is refused with `422`.
  - name: payment_method
    type: string
    required: false
    description: How the customer will pay. When the order config's `customer.ordering.payment_methods` policy lists methods (e.g. `["cash", "card"]`), it must be one of them (`422` otherwise); when the list is empty it is not stored. Stored on the payload when the payload is built from this request (inline `payload` object or `pickup`/`dropoff` fields), not on an existing payload passed by id. Fleet-Ops v0.7.0 and later.
  - name: custom_fields
    type: object
    required: false
    description: |-
      Values for the order config's custom fields, as `{ name: value }` (the order config lists them under `custom_fields`). A field is matched by its name, its label, or its label in snake case; values for fields the config doesn't have are ignored. When any value is sent, each field's own validation rules apply and every required field must be given (`422` with the first validation message); a request without `custom_fields` isn't checked. Fleet-Ops v0.7.0 and later.
  - name: payload
    type: string|object
    required: false
    description: |-
      Either an existing Payload public_id, or an inline object with `{ pickup, dropoff, return, waypoints, entities }`. The controller mirrors `OrderController::create`'s payload-building branch — Place sub-objects accept either a public_id or the standard Place fillable shape; entities accept the standard Entity fillable shape.
  - name: pickup
    type: string|object
    required: false
    description: Accepted only when `payload` is not provided. Either an existing Place public_id or a Place-shaped object (`name`, `street1`, `street2`, `city`, `province`, `postal_code`, `country`, `phone`, `meta`).
  - name: dropoff
    type: string|object
    required: false
    description: Same shape as `pickup`. Accepted only when `payload` is not provided.
  - name: return
    type: string|object
    required: false
    description: Same shape as `pickup`. Accepted only when `payload` is not provided.
  - name: waypoints
    type: array of strings|objects
    required: false
    description: Accepted only when `payload` is not provided. Each item is either a Place public_id or a Place-shaped object.
  - name: entities
    type: array of objects
    required: false
    description: |-
      Accepted only when `payload` is not provided. Each entity uses the standard Entity field shape: `name`, `description`, `weight`, `weight_unit`, `declared_value`, `currency`, `meta`. The controller delegates to `Payload::setEntities` so customer-created orders are indistinguishable from operator-created ones at the data layer.
