$kind: http-request
name: "Save a Customer Place"
description: |-
  Saves a Place for the authenticated customer (owned by the customer's contact, in the company resolved from the API credential) and returns it. `name`, `latitude` and `longitude` are required; a missing name or out-of-range coordinates answer `422` (`A name, latitude and longitude are required.`).

  Fleet-Ops v0.7.0 and later.
url: "{{base_url}}/{{namespace}}/customers/places"
method: POST
headers:
  Accept: application/json
  Customer-Token: "{{customer_token}}"
body:
  type: json
  content: |-
    {
      "name": "Work",
      "street1": "1 Knutsford Boulevard",
      "city": "Kingston",
      "country": "JM",
      "latitude": 18.0091,
      "longitude": -76.7836
    }
scripts:
  - type: afterResponse
    code: |-
      var json_response = pm.response.json();
      let cv = pm.environment;

      if (json_response && json_response.id) {
        cv.set("customer_place_id", json_response.id);
      }
    language: text/javascript

order: 12300
