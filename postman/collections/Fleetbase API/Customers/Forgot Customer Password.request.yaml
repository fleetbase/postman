$kind: http-request
name: "Forgot Customer Password"
description: |-
  Sends a password-reset verification code to the customer's email or phone. Always returns `{ status: ok }` regardless of whether the identity matches an account (prevents enumeration). The code expires after ten minutes and can be used once.

  When `identity` is a phone number the code goes by SMS through the platform's SMS guard. A refused text answers `422` (the number is invalid or cannot receive a text message), `429` with a `Retry-After` header (a cooldown on that number, or the organization's message budget) or `423` (text messages are paused). Limited to five requests a minute per caller.
url: "{{base_url}}/{{namespace}}/customers/forgot-password"
method: POST
body:
  type: json
  content: |-
    {
      "identity": "{{customer_identity}}"
    }

order: 6000
