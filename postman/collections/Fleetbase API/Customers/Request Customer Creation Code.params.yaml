$kind: params
fields:
  - name: identity
    type: string
    required: true
    description: Customer email address or phone number to send the verification code to.
  - name: mode
    type: string
    required: true
    description: Channel to send the code through. One of `email` or `sms`.
  - name: name
    type: string
    required: false
    description: Customer display name. When supplied, the verification message greets the customer by name (otherwise it addresses the identity).
  - name: phone
    type: string
    required: false
    description: Phone number (E.164 recommended) to carry alongside an email identity. Nothing is stored until `Create a Customer` verifies the code.
