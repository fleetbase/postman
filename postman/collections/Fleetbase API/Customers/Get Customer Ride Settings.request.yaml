$kind: http-request
name: "Get Customer Ride Settings"
description: |-
  Returns what a rider app shows from the operator's ride settings (the `rider` block of the company's `ride` order config): `{ emergency_number, support: { phone, email } }`. Each value is `null` when not set, including when the company has no `ride` order config.

  Fleet-Ops v0.7.0 and later.
url: "{{base_url}}/{{namespace}}/customers/ride-settings"
method: GET
headers:
  Accept: application/json
  Customer-Token: "{{customer_token}}"

order: 16000
