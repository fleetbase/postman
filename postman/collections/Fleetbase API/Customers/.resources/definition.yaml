description: |-
  Customer endpoints provide email/password + verification-code authentication and customer-scoped order management for FleetOps, without requiring the Storefront publishable key. All flows authenticate to a single Fleetbase company resolved from your `flb_live_…` API credential; per-customer requests additionally require the `Customer-Token` returned by signup/login.

  Since Fleet-Ops v0.7.0 the folder also covers what a customer app needs, whatever the business (haulage, transport, rental, parcel delivery, moving people): phone sign-in with one code for new and existing customers, saved places and address lookup, placing, dispatching, canceling and tracking an order, chatting with and rating its driver, sharing its tracking, and account deletion. Requests that send a text share a limit of five a minute per caller.

  ## Order config policies

  Nothing here is specific to one kind of business. What a customer may do with an order comes from the **policies** of the order's config (see `Order Configs`), which every config has with defaults filled in and which a customer app reads from `Retrieve an Order Config`:

  - `customer.ordering`: the payment methods a customer can choose (`payment_methods`), whether an order needs a service quote (`require_quote`), and whether an earlier order paid by one of the listed methods must be settled first (`require_settlement`).
  - `customer.cancellation`: whether customers may cancel (`enabled`) and up to which activity (`allowed_until`).
  - `customer.interactions`: chatting with the driver (`chat`), rating the driver (`rating`) and sharing live tracking (`share_tracking`). All off by default; the endpoints answer `403` while their setting is off.
  - `dispatch.adhoc`: whether customer orders are ad hoc (`customer_orders`), so `Dispatch a Customer Order` offers them to nearby drivers, and how.
  - `dispatch.matching`: `vehicle_type` limits drivers to the vehicle type of the quoted service, which makes a quote required.

  Order responses are the standard Order resource. The order's status starts at its config's initial activity, and the config's triggers (notifications, chat and the like) run on its events. A company can also limit which order configs customers may order (`fleet-ops.customer-enabled-order-configs`).
