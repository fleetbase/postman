$kind: http-request
name: "Get Customer Order ETA"
description: |-
  Returns the ETA for one of the authenticated customer's orders: the same ETA payload as `Orders/Get Order ETA`, scoped to the customer's own order.

  Optional query parameters `provider`, `fallbacks` and `traffic_enabled` are passed to the tracker. Answers `404` (`Order not found.`) for an order that isn't the customer's and `503` (`Unable to track this order.`) when the ETA can't be worked out. Fleet-Ops v0.7.0 and later.
url: "{{base_url}}/{{namespace}}/customers/orders/{{customer_order_id}}/eta"
method: GET
headers:
  Accept: application/json
  Customer-Token: "{{customer_token}}"

order: 15300
