$kind: http-request
name: "Share a Customer Order"
description: |-
  Returns a link the customer can send to someone they trust, who can then follow the order live on the public tracking page without a code: `{ url, expires_at }`. `url` is the order's tracking page link with a `share` token added; the page redeems it with `Tracking Page/Redeem a Shared Tracking Link`. The token opens only this customer's view of this order and lasts 12 hours.

  Needs the order config's `customer.interactions.share_tracking` policy: `403` (`Sharing tracking is not available for this order.`) while it is off, which is the default. Other errors: `422` (`This order can no longer be shared.`) when the order has no tracking number or has ended (completed, canceled or a terminal activity); `404` (`Order not found.`) for an order that isn't the authenticated customer's. Fleet-Ops v0.7.0 and later.
url: "{{base_url}}/{{namespace}}/customers/orders/{{customer_order_id}}/share"
method: POST
headers:
  Accept: application/json
  Customer-Token: "{{customer_token}}"
scripts:
  - type: beforeRequest
    code: |-
      // The contract run's customer order is on the default transport config, whose
      // customer.interactions.share_tracking policy is off, so the documented answer
      // is 403. An environment whose order config turns sharing on declares
      // customer_interactions_share_tracking and expects the link.
      if (!pm.environment.get('customer_interactions_share_tracking')) {
          pm.variables.set('expected_status', 403);
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      // Tracking Page/Redeem a Shared Tracking Link redeems this token.
      var json_response = pm.response.json();
      let cv = pm.environment;

      if (json_response && json_response.url) {
        var match = /[?&]share=([^&#]+)/.exec(json_response.url);
        if (match) {
          cv.set("tracking_share_token", decodeURIComponent(match[1]));
        }
      }
    language: text/javascript

order: 15600
