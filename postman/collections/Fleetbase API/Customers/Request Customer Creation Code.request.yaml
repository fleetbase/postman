$kind: http-request
name: "Request Customer Creation Code"
description: |-
  Sends an email or SMS verification code to start a customer signup. Required before calling `Create a Customer`. The code expires after ten minutes and can be used once.

  Nothing is persisted until the code is verified: an identity with no account gets its code without a pending user record being created. Optionally include `name` so the verification message greets the customer by name.

  SMS mode validates the phone number and passes every message through the platform's SMS guard, which bounds how many texts an API credential can send. Endpoints that send a text are limited to five requests a minute per caller; a text the guard refuses is returned as a generic send error.
url: "{{base_url}}/{{namespace}}/customers/request-creation-code"
method: POST
body:
  type: json
  content: |-
    {
      "identity": "{{customer_identity}}",
      "mode": "email",
      "name": "{{customer_name}}",
      "phone": "{{customer_phone}}"
    }

order: 1000
