$kind: http-request
description: Query and filter company-scoped Trailers.
url: "{{base_url}}/{{namespace}}/trailers"
method: GET
headers: { Accept: application/json }
queryParams: { query: Postman Reefer, limit: "25", sort: -created_at }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |
      pm.test("Trailer query succeeds", () => pm.response.to.have.status(200));
      pm.test("Query returns matching Trailers", () => { const body = pm.response.json(); pm.expect(body).to.be.an("array"); pm.expect(body.map(item => item.id)).to.include(pm.environment.get("trailer_id")); });
order: 2000
