$kind: http-request
description: Verify completed history remains after the current towing connection ends.
url: "{{base_url}}/{{namespace}}/trailers/:id/connections"
method: GET
headers: { Accept: application/json }
pathVariables: [{ key: id, value: "{{trailer_id}}", description: Trailer public ID. }]
scripts:
  - type: afterResponse
    language: text/javascript
    code: |
      const body = pm.response.json(); pm.test("Detached history remains", () => { pm.response.to.have.status(200); const connection = body.data.find(item => item.id === pm.environment.get("trailer_connection_id")); pm.expect(connection).to.be.an("object"); pm.expect(connection.active).to.eql(false); pm.expect(connection.disconnected_at).to.be.ok; });
order: 19000
