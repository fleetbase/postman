$kind: http-request
description: |-
  Creates a new order for the current company. Provide an existing payload ID, an inline payload, a pickup/dropoff pair, or at least two waypoints; Fleetbase creates or attaches the payload before creating the order.

  You can assign a driver, vehicle, facilitator, customer, service quote, or schedule at creation time. When `dispatch` is true, Fleetbase dispatches the order after it is created unless the order belongs to an integrated vendor flow.
url: "{{base_url}}/{{namespace}}/orders"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |
    {
      "pickup": "Singapore 018971",
      "dropoff": "321 Orchard Rd, Singapore",
      "waypoints": [
          "10 Bayfront Avenue, Singapore 018956",
          "18 Marina Gardens Drive, Singapore 018953",
          "80 Mandai Lake Rd, Singapore 729826",
          "1 Beach Road, Singapore 189673"
      ],
      "dispatch": false,
      "driver": "{{driver_id}}",
      "facilitator": "{{vendor_id}}",
      "customer": "{{contact_id}}",
      "meta": {
          "Warehouse": "WAREHOUSE-123"
      },
      "notes": "Order notes"
    }
scripts:
  - type: afterResponse
    code: |-
      var json_response = pm.response.json();
      let cv = pm.environment;
      cv.set("order_id", json_response.id);

      // Set Order Destination points the order at {{waypoint_id}}, and the activity cycle
      // (Get Order Next Activity / Update Order Activity) then walks forward from there.
      // It has to be the FIRST stop: a later one leaves every stop before it untouched,
      // and Complete an Order refuses the order with "Not all waypoints completed". A
      // random pick here passed or failed by luck.
      if (Array.isArray(json_response.payload.waypoints) && json_response.payload.waypoints.length) {
          const firstWaypoint = json_response.payload.waypoints
              .slice()
              .sort((a, b) => (a.order || 0) - (b.order || 0))[0];
          cv.set('waypoint_id', firstWaypoint.id);
      }

      // A new order starts a new activity cycle, so forget that an earlier order's flow
      // ran out.
      cv.unset('order_flow_exhausted');
      cv.unset('next_activity');
    language: text/javascript
examples: ./.resources/Create an Order.resources/examples
order: 1000
