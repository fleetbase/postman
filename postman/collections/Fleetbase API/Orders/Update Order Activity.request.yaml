$kind: http-request
description: |-
  Updates the current activity state for an order. The response returns the order with the latest workflow activity applied.

  Since Fleet-Ops v0.7.0 the order's config decides whether the update is allowed (`OrderConfig::authorizeTransition()`), answering `422` for an order that has already finished (`This order has already finished.`, at a terminal activity of its config), an activity its config's strict transitions don't permit from the current one (`This activity is not a permitted next step for the order.`), `dispatched` on a config whose lifecycle turns dispatch off (`Orders of this type are not dispatched.`), and an activity that needs proof of delivery sent without `proof` (`Proof of delivery is required for this activity or must be explicitly bypassed.`). With strict transitions the config's own definition of the activity replaces the one sent. An order whose status is `completed` still answers `400` (`Order is already completed.`). Reaching an activity runs that activity's trigger actions.
url: "{{base_url}}/{{namespace}}/orders/:id/update-activity"
method: POST
pathVariables:
  - key: id
    value: "{{order_id}}"
    description: (Required) The id of the order to dispatch.
body:
  type: json
  content: |-
    {
        "activity": {{next_activity}},
        "skip_dispatch": false
    }
scripts:
  - type: beforeRequest
    code: |-
      // Once Get Order Next Activity found the flow exhausted, the order is complete and
      // the API refuses further activity with 400 "Order is already completed." — the
      // documented answer, so the surplus passes of the contract run's cycle assert it.
      if (pm.environment.get('order_flow_exhausted')) {
          pm.variables.set('expected_status', 400);
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      // Applying an activity that completes the current stop advances the order to the
      // next one, so re-read the destination for the following next-activity lookup.
      var json_response = pm.response.json();
      var waypoint = json_response && json_response.payload ? json_response.payload.current_waypoint : null;

      if (waypoint) {
          pm.environment.set("current_waypoint_id", waypoint);
      }
    language: text/javascript
examples: ./.resources/Update Order Activity.resources/examples
order: 6000
