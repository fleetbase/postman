$kind: http-request
description: |-
  Returns the next workflow activity for an order. Use it to determine the next operational step available to the assigned driver or dispatcher.
url: "{{base_url}}/{{namespace}}/orders/:id/next-activity"
method: GET
pathVariables:
  - key: id
    value: "{{order_id}}"
    description: (Required) The id of the order.
queryParams:
  waypoint: "{{current_waypoint_id}}"
body:
  type: json
  content: ""
scripts:
  - type: beforeRequest
    code: |-
      // A contract run cycles this request with Update Order Activity more times than an
      // order can need, since how many activities a flow takes is not known up front. Once
      // the flow is exhausted there is nothing left to look up, so the surplus passes are
      // skipped rather than sent: a skipped request is neither a pass nor a failure.
      if (pm.environment.get('order_flow_exhausted')) {
          pm.execution.skipRequest();
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      // The response is the list of activities available from the order's current point in
      // its flow. Update Order Activity applies one of them, so keep the first — that is
      // what a driver app does when the operator taps the next step.
      var json_response = pm.response.json();

      if (Array.isArray(json_response) && json_response.length) {
          pm.environment.set("next_activity", JSON.stringify(json_response[0]));
      } else {
          // An empty list means the order has reached the end of its flow: applying the
          // last activity completed it. Update Order Activity would now answer 400
          // "Order is already completed.", so the cycle stops here.
          pm.environment.set("order_flow_exhausted", "true");
          pm.environment.unset("next_activity");
      }
    language: text/javascript
examples: ./.resources/Get Order Next Activity.resources/examples
order: 7000
