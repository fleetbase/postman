$kind: http-request
description: |-
  The assigned driver accepts the order offered to them, and the order is returned with `offer.status` `accepted`. An ad hoc order that has no driver yet is assigned to the accepting driver. An offer that has expired can still be accepted while the driver is assigned.

  The driver is the one named by `driver`, or else the driver profile of the authenticated user (a driver signed in to the Navigator app). Dispatch and the order's channels receive the realtime event `order.offer_accepted`. Starting the order also accepts an open offer.

  When a driver is assigned, Fleetbase records an offer on the order (`offer`, see the Order object) that expires after the company setting `fleetops.offer_timeout_minutes` (default 5; 0 never expires). An expired offer stays with the driver, is marked `expired`, raises a `driver_not_accepted` alert for dispatch and broadcasts `order.offer_expired`.

  Errors: `404` for an unknown order (`Order resource not found.`) or when no driver is found (`No driver found to accept the order.`), `422` when the order is completed, canceled or expired (`This order can no longer be accepted.`), `403` when the order is assigned to another driver (`This order is not offered to you.`). Error bodies are `{ "error": "..." }`.

  Requires Fleet-Ops with fleetbase/fleetops#394 (release v0.6.72). In a contract run this answers for `{{offer_order_id}}` and `{{offer_driver_id}}` when the environment sets them (an order assigned to that driver and not started). Otherwise it addresses an unknown order and asserts the `404`.
url: "{{base_url}}/{{namespace}}/orders/:id/accept"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: "{{offer_order_id}}"
    description: (Required) The id of the order offered to the driver.
body:
  type: json
  content: |-
    {
        "driver": "{{offer_driver_id}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      // Answering an offer needs an order assigned to a driver that has not started, and
      // that driver. A contract run seeds neither: without {{offer_order_id}} and
      // {{offer_driver_id}} in the environment the request addresses an order that
      // doesn't exist and asserts the 404 refusal instead.
      if (!pm.environment.get("offer_order_id") || !pm.environment.get("offer_driver_id")) {
          pm.variables.set("offer_order_id", "order_missing");
          pm.variables.set("expected_status", 404);
      }
    language: text/javascript
examples: ./.resources/Accept an Order.resources/examples
order: 12500
