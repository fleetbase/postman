$kind: http-request
description: |-
  The assigned driver declines the order offered to them. The driver is taken off the order, the offer is recorded as `declined` (with the `reason`, when given), dispatch is notified, and the realtime events `order.offer_declined` (order channels) and `order.driver_unassigned` (the driver's channels) are broadcast. The order is returned without a driver, ready to be assigned again.

  The driver is the one named by `driver`, or else the driver profile of the authenticated user.

  Errors: `404` for an unknown order (`Order resource not found.`) or when no driver is found (`No driver found to decline the order.`), `403` when the order isn't assigned to this driver (`This order is not offered to you.`), `422` once the order has started (`This order has already been started and cannot be declined.`). Error bodies are `{ "error": "..." }`.

  Requires Fleet-Ops with fleetbase/fleetops#394 (release v0.6.72). In a contract run this answers for `{{offer_order_id}}` and `{{offer_driver_id}}` when the environment sets them (an order assigned to that driver and not started). Otherwise it addresses an unknown order and asserts the `404`.
url: "{{base_url}}/{{namespace}}/orders/:id/decline"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: "{{offer_order_id}}"
    description: (Required) The id of the order offered to the driver.
body:
  type: json
  content: |-
    {
        "driver": "{{offer_driver_id}}",
        "reason": "Vehicle has a flat tyre."
    }
scripts:
  - type: beforeRequest
    code: |-
      // Answering an offer needs an order assigned to a driver that has not started, and
      // that driver. A contract run seeds neither: without {{offer_order_id}} and
      // {{offer_driver_id}} in the environment the request addresses an order that
      // doesn't exist and asserts the 404 refusal instead.
      if (!pm.environment.get("offer_order_id") || !pm.environment.get("offer_driver_id")) {
          pm.variables.set("offer_order_id", "order_missing");
          pm.variables.set("expected_status", 404);
      }
    language: text/javascript
examples: ./.resources/Decline an Order.resources/examples
order: 12600
