$kind: http-request
description: |-
  Starts an order and transitions it into active execution. Use this when a driver or dispatcher begins fulfillment.
url: "{{base_url}}/{{namespace}}/orders/:id/start"
method: POST
pathVariables:
  - key: id
    value: "{{order_id}}"
    description: (Required) The id of the order to dispatch.
body:
  type: json
  content: |-
    {
        "skip_dispatch": false
    }
scripts:
  - type: afterResponse
    code: |-
      // Seeds the destination the activity cycle works through. Get Order Next Activity
      // scopes its lookup to this waypoint, and Update Order Activity re-reads it as the
      // order advances.
      var json_response = pm.response.json();
      var waypoint = json_response && json_response.payload ? json_response.payload.current_waypoint : null;

      if (waypoint) {
          pm.environment.set("current_waypoint_id", waypoint);
      }
    language: text/javascript
examples: ./.resources/Start an Order.resources/examples
order: 5000
