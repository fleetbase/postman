$kind: http-request
name: "Create a Disposable Device"
description: |-
  Creates a throwaway device purely so `Delete a Device` has
  something to delete. Without it the delete destroys `{{device_id}}`, which
  later requests in this and other folders still depend on — leaving them to
  404 against a deleted record.
url: "{{base_url}}/{{namespace}}/devices"
method: POST
body:
  type: json
  content: |-
    {
      "name": "OBD Tracker 12",
      "type": "obd",
      "device_id": "OBD-12",
      "serial_number": "SN-10001",
      "status": "active"
    }
scripts:
  - type: afterResponse
    code: |
      var json_response = pm.response.json();
      let cv = pm.environment;
      cv.set("device_id_disposable", json_response.id);
    language: text/javascript
order: 4999
