$kind: http-request
name: "Create a Disposable Vendor"
description: |-
  Creates a throwaway vendor purely so `Delete a Vendor` has
  something to delete. Without it the delete destroys `{{vendor_id}}`, which
  later requests in this and other folders still depend on — leaving them to
  404 against a deleted record.
url: "{{base_url}}/{{namespace}}/vendors"
method: POST
headers:
  Accept: application/json
body:
  type: json
  content: |
    {
      "name": "ABC Corporation",
      "type": "Supplier",
      "email": "abc@example.com",
      "phone": "1234567890"
    }
scripts:
  - type: afterResponse
    code: |+
      var json_response = pm.response.json();
      let cv = pm.environment;
      cv.set("vendor_id_disposable", json_response.id);

    language: text/javascript
order: 4999
