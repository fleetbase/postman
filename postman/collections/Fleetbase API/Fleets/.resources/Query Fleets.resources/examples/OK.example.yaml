$kind: http-example
request:
  url: "{{base_url}}/{{namespace}}/fleets?limit=25&offset=0&sort=created_at&parents_only=true"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: limit
      value: "25"
      description: A limit on the number of objects to be returned. Limit can range between 1 and 100, and the default is 10.
    - key: offset
      value: "0"
      description: A cursor for use in pagination. When an offset is supplied the results start from that offset.
    - key: sort
      value: created_at
      description: Any property of the object. Prefix with a minus symbol to sort descending, for example `-created_at`.
    - key: parents_only
      value: "true"
      description: Return only root fleets — those with no parent fleet.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
