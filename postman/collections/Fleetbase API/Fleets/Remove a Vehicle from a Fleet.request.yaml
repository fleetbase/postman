$kind: http-request
description: |-
  Removes a vehicle from a fleet. Both path parameters are public IDs.

  Removing a membership never deletes the vehicle, never changes a driver's current vehicle, and never affects the resource's membership of any other fleet. Repeating the removal is a successful no-op.
url: "{{base_url}}/{{namespace}}/fleets/:id/vehicles/:vehicle"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: "{{fleet_id}}"
    description: (Required) The public id of the `Fleet`.
  - key: vehicle
    value: "{{fleet_vehicle_id}}"
    description: (Required) The public id of the `Vehicle` to remove from the fleet.
scripts:
  - type: afterResponse
    code: |-
      var json_response = pm.response.json();

      pm.test("Remove a Vehicle from a Fleet confirms the membership is gone", function () {
          pm.expect(pm.response.code, `got HTTP ${pm.response.code}`).to.be.oneOf([200]);
          pm.expect(json_response, "response is not an object").to.be.an('object');
          pm.expect(json_response.fleet, "fleet must be a public id").to.match(/^fleet_/);
          pm.expect(json_response.vehicle, "vehicle must be a public id").to.match(/^vehicle_/);
          pm.expect(json_response.assigned, "assigned must be false after a removal").to.be.false;
      });

      pm.test("Remove a Vehicle from a Fleet returns no internal uuids", function () {
          ["fleet_uuid", "vehicle_uuid", "uuid"].forEach(function (key) {
              pm.expect(json_response, `internal column ${key} leaked into the public contract`).to.not.have.property(key);
          });
      });
    language: text/javascript
examples: ./.resources/Remove a Vehicle from a Fleet.resources/examples
order: 4100
