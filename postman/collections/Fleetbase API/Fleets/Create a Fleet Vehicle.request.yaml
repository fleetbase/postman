$kind: http-request
description: |-
  Creates a vehicle for the fleet membership requests to operate on.

  The vehicle created in the **Vehicles** folder is deleted before this folder runs, so the membership assertions need a resource of their own. It is removed again by **Delete a Fleet Vehicle** at the end of this folder.
url: "{{base_url}}/{{namespace}}/vehicles"
method: POST
headers:
  Accept: application/json
body:
  type: json
  content: |-
    {
        "name": "Fleet Membership Van",
        "make": "Toyota",
        "model": "HiAce",
        "year": 2024,
        "plate_number": "FLT-0001",
        "status": "available"
    }
scripts:
  - type: afterResponse
    code: |-
      var json_response = pm.response.json();
      pm.environment.set("fleet_vehicle_id", json_response.id);

      pm.test("Create a Fleet Vehicle returns a vehicle to assign", function () {
          pm.expect(pm.response.code, `got HTTP ${pm.response.code}`).to.be.oneOf([200, 201]);
          pm.expect(json_response.id, "id is not a vehicle public id").to.match(/^vehicle_/);
      });
    language: text/javascript
order: 1200
