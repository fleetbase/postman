$kind: http-request
description: |-
  Creates a fleet for grouping drivers and vehicles.

  Every safe fleet field is accepted: name, colour, task, status, and the service area, zone, vendor and parent fleet relationships. Relationships are given as public IDs (`service_area_...`, `zone_...`, `vendor_...`, `fleet_...`) and are resolved inside the authenticated organization — a public ID belonging to another organization is rejected exactly as a non-existent one is.

  Omitting `parent_fleet` creates a root fleet. This request creates the parent used by **Create a Subfleet**.
url: "{{base_url}}/{{namespace}}/fleets"
method: POST
headers:
  Accept: application/json
body:
  type: json
  content: |-
    {
        "name": "Haulers",
        "color": "#2563EB",
        "task": "Long haul distribution",
        "status": "active",
        "service_area": "{{service_area_id}}"
    }
scripts:
  - type: afterResponse
    code: |-
      var json_response = pm.response.json();
      let cv = pm.environment;

      cv.set("fleet_id", json_response.id);
      cv.set("fleet_name", json_response.name);
      // The subfleet request below parents itself to this fleet.
      cv.set("parent_fleet_id", json_response.id);

      pm.test("Create a Fleet returns the persisted fleet", function () {
          pm.expect(pm.response.code, `got HTTP ${pm.response.code}`).to.be.oneOf([200, 201]);
          pm.expect(json_response, "response is not an object").to.be.an('object');
          pm.expect(json_response.id, "no public id returned").to.be.a('string').and.not.empty;
          pm.expect(json_response.id, "id is not a fleet public id").to.match(/^fleet_/);
      });

      pm.test("Create a Fleet persists every field that was sent", function () {
          pm.expect(json_response.name).to.eql("Haulers");
          pm.expect(json_response.color).to.eql("#2563EB");
          pm.expect(json_response.task).to.eql("Long haul distribution");
          pm.expect(json_response.status).to.eql("active");
      });

      pm.test("Create a Fleet resolves the service area to a public id", function () {
          const serviceAreaId = pm.variables.get("service_area_id");
          pm.expect(json_response).to.have.property("service_area");
          if (serviceAreaId) {
              pm.expect(json_response.service_area).to.eql(serviceAreaId);
          }
      });

      pm.test("Create a Fleet is a root fleet when no parent was sent", function () {
          pm.expect(json_response).to.have.property("parent_fleet");
          pm.expect(json_response.parent_fleet, "a fleet created without a parent must have none").to.be.null;
      });

      pm.test("Create a Fleet exposes no internal uuid columns", function () {
          ["uuid", "public_id", "company_uuid", "service_area_uuid", "zone_uuid", "vendor_uuid", "parent_fleet_uuid", "image_uuid", "_key"].forEach(function (key) {
              pm.expect(json_response, `internal column ${key} leaked into the public contract`).to.not.have.property(key);
          });
      });
    language: text/javascript
examples: ./.resources/Create a Fleet.resources/examples
order: 1000
