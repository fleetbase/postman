$kind: http-request
name: "Create a Disposable Fleet"
description: |-
  Creates a throwaway fleet purely so `Delete a Fleet` has
  something to delete. Without it the delete destroys `{{fleet_id}}`, which
  later requests in this and other folders still depend on — leaving them to
  404 against a deleted record.
url: "{{base_url}}/{{namespace}}/fleets"
method: POST
headers:
  Accept: application/json
body:
  type: json
  content: |-
    {
        "name": "Haulers",
        "service_area": "{{service_area_id}}"
    }
scripts:
  - type: afterResponse
    code: |-
      var json_response = pm.response.json();
      let cv = pm.environment;

      cv.set("fleet_id_disposable", json_response.id);
    language: text/javascript
order: 4999
