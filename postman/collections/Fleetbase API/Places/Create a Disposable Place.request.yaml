$kind: http-request
name: "Create a Disposable Place"
description: |-
  Creates a throwaway place purely so `Delete a Place` has
  something to delete. Without it the delete destroys `{{place_id}}`, which
  later requests in this and other folders still depend on — leaving them to
  404 against a deleted record.
url: "{{base_url}}/{{namespace}}/places"
method: POST
headers:
  Accept: application/json
body:
  type: json
  content: |
    {
      "name": "Central Park",
      "street1": "830 5th Ave",
      "city": "New York",
      "province": "New York",
      "postal_code": "10065",
      "neighborhood": "Manhattan",
      "district": "Midtown",
      "building": "Park Area",
      "country": "US",
      "phone": "+12123106600",
      "type": "Park"
    }
scripts:
  - type: afterResponse
    code: |-
      var json_response = pm.response.json();
      let cv = pm.environment;

      cv.set("place_id_disposable", json_response.id);
    language: text/javascript
order: 5999
