$kind: http-request
name: "Create a Disposable Contact"
description: |-
  Creates a throwaway contact purely so `Delete a Contact` has
  something to delete. Without it the delete destroys `{{contact_id}}`, which
  later requests in this and other folders still depend on — leaving them to
  404 against a deleted record.
url: "{{base_url}}/{{namespace}}/contacts"
method: POST
headers:
  Accept: application/json
body:
  type: json
  content: |
    {
      "name": "John Doe",
      "type": "customer",
      "title": "Mr",
      "email": "john@exampleco.com",
      "phone": "+1 563-920-4264"
    }
scripts:
  - type: afterResponse
    code: |+
      var json_response = pm.response.json();
      let cv = pm.environment;
      cv.set("contact_id_disposable", json_response.id);

    language: text/javascript
order: 4999
