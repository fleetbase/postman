$kind: http-request
description: "Create an Issue"
url: "{{base_url}}/{{namespace}}/issues"
method: POST
body:
  type: json
  content: |-
    {
      "driver": "{{driver_id}}",
      "location": {
        "latitude": 1.3521,
        "longitude": 103.8198
      },
      "report": "Vehicle tire pressure warning",
      "category": "vehicle",
      "type": "maintenance",
      "priority": "medium",
      "status": "open"
    }

scripts:
  - type: afterResponse
    code: |
      var json_response = pm.response.json();
      let cv = pm.environment;
      cv.set("issue_id", json_response.id);
    language: text/javascript
order: 1000
