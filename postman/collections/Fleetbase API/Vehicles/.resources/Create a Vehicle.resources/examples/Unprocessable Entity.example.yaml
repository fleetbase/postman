$kind: http-example
request:
  url: "{{base_url}}/{{namespace}}/vehicles"
  method: POST
  headers:
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "make": "Toyota",
        "odometer": -5,
        "status": "not-a-status"
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          "The odometer must be at least 0.",
          "The selected status is invalid."
        ]
      }
order: 2000
