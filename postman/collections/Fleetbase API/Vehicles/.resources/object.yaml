$kind: object
name: Vehicle
description: |-
  A vehicle represents a trackable asset used for Fleet-Ops assignment, routing, and capacity planning. It stores vehicle identity, status, assignment, current position, capacity, dimensions, engine and regulatory specifications, financing, orchestrator constraints, and metadata.

  Each relationship appears twice, and the two are separate keys. `<name>_id` is the related resource's public ID and is always present. `<name>` is the nested object and is returned only when the relationship was asked for through `?with=`; it is never a string. Internal uuid columns are never part of the public contract.
example: |
  {
    "id": "vehicle_7YqM3KpL2n",
    "internal_id": "VEH-1001",
    "photo_url": null,
    "avatar_url": null,
    "name": "ABC123",
    "description": null,
    "driver": null,
    "make": "Toyota",
    "model": "Camry",
    "year": 2023,
    "trim": "SE",
    "type": "sedan",
    "plate_number": "ABC123",
    "vin": "1GCGSBEA0G1111111",
    "status": "operational",
    "online": false,
    "payload_capacity": 500,
    "fuel_card_number": "FC-1001",
    "driver_id": null,
    "vendor_id": "vendor_5Nq8Tz1Wm4",
    "category_id": null,
    "warranty_id": null,
    "photo_id": null,
    "skills": ["tail_lift"],
    "max_tasks": 40,
    "time_window_start": "08:00:00",
    "time_window_end": "18:00:00",
    "return_to_depot": true,
    "location": {
      "latitude": 40.7484,
      "longitude": -73.9857
    },
    "heading": 0,
    "altitude": 0,
    "speed": 0,
    "notes": null,
    "meta": {},
    "updated_at": "2026-05-07T08:30:00.000000Z",
    "created_at": "2026-05-07T08:30:00.000000Z"
  }
fields:
  - name: id
    type: string
    description: Public vehicle identifier.
  - name: internal_id
    type: string
    description: Optional internal identifier.
  - name: photo_url
    type: string
    description: Vehicle photo URL.
  - name: avatar_url
    type: string
    description: Vehicle avatar URL.
  - name: name
    type: string
    description: Vehicle display name.
  - name: description
    type: string
    description: Vehicle description.
  - name: driver
    type: object
    description: |-
      The assigned driver, returned only when requested through `with=driver`. Never a string — read `driver_id` for the identifier.
  - name: devices
    type: array of objects
    description: Vehicle devices, when loaded.
  - name: make
    type: string
    description: Vehicle manufacturer.
  - name: model
    type: string
    description: Vehicle model.
  - name: model_type
    type: string
    description: Vehicle model type.
  - name: year
    type: integer
    description: Model year.
  - name: trim
    type: string
    description: Vehicle trim.
  - name: type
    type: string
    description: Vehicle type.
  - name: class
    type: string
    description: Vehicle class.
  - name: color
    type: string
    description: Vehicle color.
  - name: serial_number
    type: string
    description: Vehicle serial number.
  - name: plate_number
    type: string
    description: License plate number.
  - name: call_sign
    type: string
    description: Vehicle call sign.
  - name: fuel_card_number
    type: string
    description: Fuel card number assigned to the vehicle.
  - name: vin
    type: string
    description: Vehicle identification number.
  - name: vin_data
    type: object
    description: Decoded VIN data.
  - name: specs
    type: object
    description: Vehicle specification data.
  - name: details
    type: object
    description: Additional vehicle detail data.
  - name: status
    type: enum
    values: ["active", "available", "in_use", "maintenance", "out_of_service", "reserved", "retired", "staging", "on_route", "idle", "cleaning", "awaiting_parts", "inspection_due", "inspection_failed", "accident", "compliance_hold", "stolen", "operational", "decommissioned"]
    description: |-
      Vehicle operational status. `active` is accepted on input and stored as `available`.
  - name: online
    type: boolean
    description: Whether the vehicle is online.
  - name: slug
    type: string
    description: URL-friendly vehicle slug.
  - name: financing_status
    type: string
    description: Vehicle financing status.
  - name: measurement_system
    type: string
    description: Measurement system used for vehicle metrics.
  - name: odometer
    type: number
    description: Current odometer reading.
  - name: odometer_unit
    type: string
    description: Unit for odometer readings.
  - name: fuel_type
    type: string
    description: Vehicle fuel type.
  - name: payload_capacity
    type: number
    description: Payload capacity.
  - name: towing_capacity
    type: number
    description: Towing capacity.
  - name: seating_capacity
    type: integer
    description: Seating capacity.
  - name: weight
    type: number
    description: Vehicle weight.
  - name: length
    type: number
    description: Vehicle length.
  - name: width
    type: number
    description: Vehicle width.
  - name: height
    type: number
    description: Vehicle height.
  - name: currency
    type: currency
    description: Currency for vehicle financial fields.
  - name: acquisition_cost
    type: currency
    description: Acquisition cost.
  - name: current_value
    type: currency
    description: Current vehicle value.
  - name: purchased_at
    type: timestamp
    description: Purchase timestamp.
  - name: lease_expires_at
    type: timestamp
    description: Lease expiration timestamp.
  - name: deleted_at
    type: timestamp
    description: Deletion timestamp when soft deleted.
  - name: updated_at
    type: timestamp
    description: Timestamp when the vehicle was last updated.
  - name: created_at
    type: timestamp
    description: Timestamp when the vehicle was created.
  - name: location
    type: object
    description: Current vehicle coordinates.
  - name: heading
    type: integer
    description: Current heading in degrees.
  - name: altitude
    type: integer
    description: Current altitude.
  - name: speed
    type: integer
    description: Current speed.
  - name: telematics
    type: object
    description: Telematics payload.
  - name: notes
    type: string
    description: Vehicle notes.
  - name: meta
    type: object
    description: Additional vehicle metadata.
  - name: driver_id
    type: string
    description: Public ID of the assigned driver, or `null`. Always present.
  - name: vendor_id
    type: string
    description: Public ID of the assigned vendor, or `null`. Always present.
  - name: category_id
    type: string
    description: Public ID of the assigned category, or `null`. Always present.
  - name: warranty_id
    type: string
    description: Public ID of the assigned warranty, or `null`. Always present.
  - name: photo_id
    type: string
    description: |-
      Public ID of the vehicle photo file, or `null`. Always present. `photo_url` beside it is a convenience URL, and `avatar_url` is a separate display asset that is not a file reference.
  - name: vendor
    type: object
    description: |-
      The assigned vendor, returned only when requested through `with=vendor`. Never a string — read `vendor_id` for the identifier.
  - name: category
    type: object
    description: The assigned category, returned only when requested through `with=category`.
  - name: warranty
    type: object
    description: The assigned warranty, returned only when requested through `with=warranty`.
  - name: photo
    type: object
    description: The vehicle photo file, returned only when requested through `with=photo`.
  - name: skills
    type: array of strings
    description: Capabilities the vehicle offers for orchestrator assignment.
  - name: payload_capacity_volume
    type: number
    description: Payload volume capacity used by orchestrator assignment.
  - name: payload_capacity_pallets
    type: integer
    description: Pallet capacity used by orchestrator assignment.
  - name: payload_capacity_parcels
    type: integer
    description: Parcel capacity used by orchestrator assignment.
  - name: max_tasks
    type: integer
    description: Maximum concurrent tasks for orchestrator assignment.
  - name: time_window_start
    type: string
    description: Earliest time of day the vehicle is available.
  - name: time_window_end
    type: string
    description: Latest time of day the vehicle is available.
  - name: return_to_depot
    type: boolean
    description: Whether the vehicle should return to depot after assigned work.
  - name: fuel_volume_unit
    type: string
    description: Unit for fuel volumes.
  - name: odometer_at_purchase
    type: number
    description: Odometer reading at the time of purchase.
  - name: transmission
    type: string
    description: Transmission type.
  - name: body_type
    type: string
    description: Vehicle body type.
  - name: body_sub_type
    type: string
    description: Vehicle body sub type.
  - name: usage_type
    type: string
    description: How the vehicle is used.
  - name: ownership_type
    type: string
    description: How the vehicle is held.
  - name: cargo_volume
    type: number
    description: Cargo volume.
  - name: passenger_volume
    type: number
    description: Passenger volume.
  - name: interior_volume
    type: number
    description: Total interior volume.
  - name: ground_clearance
    type: number
    description: Ground clearance.
  - name: bed_length
    type: number
    description: Bed length.
  - name: fuel_capacity
    type: number
    description: Fuel tank capacity.
  - name: emission_standard
    type: string
    description: Emission standard the vehicle meets.
  - name: dpf_equipped
    type: boolean
    description: Whether a diesel particulate filter is fitted.
  - name: scr_equipped
    type: boolean
    description: Whether selective catalytic reduction is fitted.
  - name: gvwr
    type: number
    description: Gross vehicle weight rating.
  - name: gcwr
    type: number
    description: Gross combined weight rating.
  - name: engine_number
    type: string
    description: Engine number.
  - name: engine_make
    type: string
    description: Engine manufacturer.
  - name: engine_model
    type: string
    description: Engine model.
  - name: engine_family
    type: string
    description: Engine family.
  - name: engine_configuration
    type: string
    description: Engine configuration.
  - name: engine_size
    type: number
    description: Engine size.
  - name: engine_displacement
    type: number
    description: Engine displacement.
  - name: cylinder_arrangement
    type: string
    description: Cylinder arrangement.
  - name: number_of_cylinders
    type: integer
    description: Number of cylinders.
  - name: horsepower
    type: number
    description: Engine horsepower.
  - name: horsepower_rpm
    type: integer
    description: RPM at which peak horsepower is produced.
  - name: torque
    type: number
    description: Engine torque.
  - name: torque_rpm
    type: integer
    description: RPM at which peak torque is produced.
  - name: estimated_service_life_distance
    type: integer
    description: Estimated service life expressed as a distance.
  - name: estimated_service_life_distance_unit
    type: string
    description: Unit for the estimated service life distance.
  - name: estimated_service_life_months
    type: integer
    description: Estimated service life expressed in months.
  - name: financing_status
    type: string
    description: Vehicle financing status.
  - name: insurance_value
    type: currency
    description: Insured value.
  - name: depreciation_rate
    type: number
    description: Depreciation rate.
  - name: loan_amount
    type: number
    description: Loan principal.
  - name: loan_number_of_payments
    type: integer
    description: Number of loan payments.
  - name: loan_first_payment
    type: date
    description: Date of the first loan payment.
