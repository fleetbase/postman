$kind: http-request
name: "Create a Disposable Vehicle"
description: |-
  Creates a throwaway vehicle purely so `Delete a Vehicle` has
  something to delete. Without it the delete destroys `{{vehicle_id}}`, which
  later requests in this and other folders still depend on — leaving them to
  404 against a deleted record.
url: "{{base_url}}/{{namespace}}/vehicles"
method: POST
headers:
  Accept: application/json
body:
  type: json
  content: |
    {
      "vin": "1GCGSBEA0G1111111",
      "year": 2023,
      "make": "Toyota",
      "model": "Camry",
      "trim": "SE",
      "plate_number": "ABC123",
      "status": "maintenance",
      "online": false
    }
scripts:
  - type: afterResponse
    code: |
      var json_response = pm.response.json();
      let cv = pm.environment;
      cv.set("vehicle_id_disposable", json_response.id);
    language: text/javascript
order: 4999
