$kind: params
fields:
  - name: internal_id
    type: string
    description: The identifier the operator's own system uses for this vehicle. Queryable through `?internal_id=`.
  - name: name
    type: string
    description: Vehicle display name.
  - name: description
    type: string
    description: Free-text description of the vehicle.
  - name: make
    type: string
    description: Vehicle manufacturer.
  - name: model
    type: string
    description: Vehicle model.
  - name: model_type
    type: string
    description: Vehicle model type or variant family.
  - name: year
    type: integer
    description: Model year of the vehicle.
  - name: trim
    type: string
    description: Vehicle trim or variant.
  - name: color
    type: string
    description: Vehicle colour.
  - name: type
    type: string
    description: Vehicle type.
  - name: class
    type: string
    description: Vehicle class.
  - name: plate_number
    type: string
    description: Vehicle licence plate number. Queryable through `?plate_number=`.
  - name: vin
    type: string
    description: Vehicle identification number. Updating it re-runs VIN decoding. Queryable through `?vin=`.
  - name: serial_number
    type: string
    description: Vehicle serial number.
  - name: call_sign
    type: string
    description: Vehicle call sign.
  - name: fuel_card_number
    type: string
    description: Fuel card number assigned to the vehicle.
  - name: odometer
    type: number
    description: Current odometer reading. Must be zero or greater.
  - name: odometer_unit
    type: string
    description: Unit for odometer readings, for example `km` or `mi`.
  - name: odometer_at_purchase
    type: number
    description: Odometer reading at the time of purchase.
  - name: measurement_system
    type: string
    description: Measurement system used for the vehicle's metrics, for example `metric` or `imperial`.
  - name: fuel_type
    type: string
    description: Vehicle fuel type.
  - name: fuel_volume_unit
    type: string
    description: Unit for fuel volumes, for example `l` or `gal`.
  - name: online
    type: boolean
    default: false
    description: |-
      Whether the vehicle is online. On create it defaults to `false`; on update it is left alone unless it is sent.
  - name: status
    type: enum
    values: ["active", "available", "in_use", "maintenance", "out_of_service", "reserved", "retired", "staging", "on_route", "idle", "cleaning", "awaiting_parts", "inspection_due", "inspection_failed", "accident", "compliance_hold", "stolen", "operational", "decommissioned"]
    description: |-
      Vehicle operational status. `active` is accepted and stored as `available`.
  - name: transmission
    type: string
    description: Transmission type.
  - name: body_type
    type: string
    description: Vehicle body type.
  - name: body_sub_type
    type: string
    description: Vehicle body sub type.
  - name: usage_type
    type: string
    description: How the vehicle is used, for example `commercial`.
  - name: ownership_type
    type: string
    description: How the vehicle is held, for example `owned` or `leased`.
  - name: cargo_volume
    type: number
    description: Cargo volume.
  - name: passenger_volume
    type: number
    description: Passenger volume.
  - name: interior_volume
    type: number
    description: Total interior volume.
  - name: weight
    type: number
    description: Vehicle weight.
  - name: width
    type: number
    description: Vehicle width.
  - name: length
    type: number
    description: Vehicle length.
  - name: height
    type: number
    description: Vehicle height.
  - name: towing_capacity
    type: number
    description: Towing capacity.
  - name: payload_capacity
    type: number
    description: Payload capacity.
  - name: seating_capacity
    type: integer
    description: Seating capacity.
  - name: ground_clearance
    type: number
    description: Ground clearance.
  - name: bed_length
    type: number
    description: Bed length.
  - name: fuel_capacity
    type: number
    description: Fuel tank capacity.
  - name: financing_status
    type: string
    description: Vehicle financing status.
  - name: loan_number_of_payments
    type: integer
    description: Number of loan payments.
  - name: loan_first_payment
    type: date
    description: Date of the first loan payment.
  - name: loan_amount
    type: number
    description: Loan principal.
  - name: estimated_service_life_distance_unit
    type: string
    description: Unit for the estimated service life distance.
  - name: estimated_service_life_distance
    type: integer
    description: Estimated service life expressed as a distance.
  - name: estimated_service_life_months
    type: integer
    description: Estimated service life expressed in months.
  - name: insurance_value
    type: number
    description: Insured value.
  - name: depreciation_rate
    type: number
    description: Depreciation rate.
  - name: current_value
    type: number
    description: Current vehicle value.
  - name: acquisition_cost
    type: number
    description: Acquisition cost.
  - name: currency
    type: string
    description: Three-letter currency code for the vehicle's monetary fields.
  - name: purchased_at
    type: timestamp
    description: When the vehicle was purchased.
  - name: lease_expires_at
    type: timestamp
    description: When the vehicle's lease expires.
  - name: emission_standard
    type: string
    description: Emission standard the vehicle meets, for example `euro6`.
  - name: dpf_equipped
    type: boolean
    description: Whether a diesel particulate filter is fitted.
  - name: scr_equipped
    type: boolean
    description: Whether selective catalytic reduction is fitted.
  - name: gvwr
    type: number
    description: Gross vehicle weight rating.
  - name: gcwr
    type: number
    description: Gross combined weight rating.
  - name: engine_number
    type: string
    description: Engine number.
  - name: engine_model
    type: string
    description: Engine model.
  - name: engine_make
    type: string
    description: Engine manufacturer.
  - name: engine_family
    type: string
    description: Engine family.
  - name: engine_configuration
    type: string
    description: Engine configuration.
  - name: engine_displacement
    type: number
    description: Engine displacement.
  - name: engine_size
    type: number
    description: Engine size.
  - name: horsepower
    type: number
    description: Engine horsepower.
  - name: horsepower_rpm
    type: integer
    description: RPM at which peak horsepower is produced.
  - name: torque
    type: number
    description: Engine torque.
  - name: torque_rpm
    type: integer
    description: RPM at which peak torque is produced.
  - name: number_of_cylinders
    type: integer
    description: Number of cylinders.
  - name: cylinder_arrangement
    type: string
    description: Cylinder arrangement, for example `I4` or `V6`.
  - name: specs
    type: object
    description: Structured vehicle specification data.
  - name: details
    type: object
    description: Structured additional vehicle detail data.
  - name: notes
    type: string
    description: Free-text notes about the vehicle.
  - name: meta
    type: object
    description: Additional vehicle metadata.
  - name: skills
    type: array of strings
    description: Capabilities the vehicle offers for orchestrator assignment, for example `tail_lift`.
  - name: payload_capacity_volume
    type: number
    description: Payload volume capacity used by orchestrator assignment.
  - name: payload_capacity_pallets
    type: integer
    description: Pallet capacity used by orchestrator assignment.
  - name: payload_capacity_parcels
    type: integer
    description: Parcel capacity used by orchestrator assignment.
  - name: max_tasks
    type: integer
    description: Maximum concurrent tasks for orchestrator assignment.
  - name: time_window_start
    type: string
    description: Earliest time of day the vehicle is available, as `HH:MM`.
  - name: time_window_end
    type: string
    description: Latest time of day the vehicle is available, as `HH:MM`.
  - name: return_to_depot
    type: boolean
    description: Whether the vehicle should return to depot after assigned work.
  - name: vendor
    type: string
    description: Vendor public ID (`vendor_...`). Send `null` to clear. Must belong to the authenticated organization.
  - name: driver
    type: string
    description: |-
      Driver public ID (`driver_...`) to assign this vehicle to. Send an empty value to unassign the current driver. Must belong to the authenticated organization.
  - name: category
    type: string
    description: Category public ID (`category_...`). Send `null` to clear.
  - name: warranty
    type: string
    description: Warranty public ID (`warranty_...`). Send `null` to clear.
  - name: photo
    type: string
    description: File public ID (`file_...`) to use as the vehicle photo.
  - name: location
    type: object
    description: Resolvable point used as the vehicle's current location.
  - name: latitude
    type: number
    description: Decimal latitude. Required with `longitude`.
  - name: longitude
    type: number
    description: Decimal longitude. Required with `latitude`.
  - name: altitude
    type: number
    description: Current altitude.
  - name: heading
    type: number
    description: Current heading in degrees.
  - name: speed
    type: number
    description: Current speed.
