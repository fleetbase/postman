$kind: params
fields:
  - name: query
    type: string
    description: Free-text search across the vehicle's searchable fields.
  - name: internal_id
    type: string
    description: |-
      Filter by the identifier the operator's own system uses. **Exact match** on the public API: `VEH-10` returns only `VEH-10`, never `VEH-100`. That is what lets an importer use it to decide between update and create. (The Fleet-Ops console does a partial search on the same field; that behaviour is internal to the console and not part of this contract.)
  - name: plate_number
    type: string
    description: Filter by licence plate number.
  - name: vin
    type: string
    description: Filter by vehicle identification number.
  - name: public_id
    type: string
    description: Filter by vehicle public ID (`vehicle_...`). Exact match.
  - name: display_name
    type: string
    description: Filter across year, make, model and plate number together.
  - name: vehicle_make
    type: string
    description: Filter by manufacturer.
  - name: vehicle_model
    type: string
    description: Filter by model.
  - name: vehicle_year
    type: string
    description: Filter by model year.
  - name: vendor
    type: string
    description: Filter by vendor, given as its public ID (`vendor_...`) or internal ID.
  - name: driver
    type: string
    description: |-
      Filter by assigned driver, given as its public ID (`driver_...`) or internal ID. Pass `unassigned` to return vehicles with no driver.
  - name: fleet
    type: string
    description: Filter to the vehicles in a fleet, given as its public ID (`fleet_...`).
  - name: assigned_fleet
    type: string
    description: Pass `false` to return vehicles that belong to no fleet.
  - name: limit
    type: integer
    description: Maximum number of vehicles to return.
  - name: offset
    type: integer
    description: Number of vehicles to skip before returning results.
  - name: sort
    type: string
    description: Sort expression for the vehicle query.
  - name: with
    type: array of strings
    description: |-
      Relationships to expand. Accepted as `?with=vendor`, `?with[]=vendor`, `?with[]=vendor&with[]=driver` and `?with=vendor,driver`; `expand` is an alias for all four. A relationship named here is additionally returned as a nested object — it never replaces or retypes the `<name>_id` identifier, which is always present. A name outside the supported set is ignored rather than rejected.
