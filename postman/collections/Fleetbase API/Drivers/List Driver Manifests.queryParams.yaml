$kind: queryParams
fields:
  - name: status
    type: string
    required: false
    description: Comma separated statuses to include, such as `pending,in_progress`.
  - name: on
    type: string
    required: false
    description: Only manifests scheduled on this date, as `YYYY-MM-DD`.
  - name: limit
    type: integer
    required: false
    description: Maximum manifests to return. Defaults to 30.
