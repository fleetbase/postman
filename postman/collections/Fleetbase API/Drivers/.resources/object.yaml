$kind: object
name: Driver
description: |-
  A driver represents a Fleet-Ops operator who can receive jobs, report location, register devices, and belong to fleets, vendors, vehicles, and organizations.

  `email` and `phone` are optional: an operational driver record may have neither, in which case the driver cannot sign in to Navigator until credentials are supplied.

  `user` and `company` are public-ID strings and have always been — Navigator interpolates `driver.user` straight into a socket channel name, so neither is ever expanded into an object. `vehicle`, `vendor` and `current_job` are objects on create, update and retrieve, which load them. The `vehicle_id`, `vendor_id` and `job_id` keys are additive identifiers beside those objects, not replacements for them. Internal uuid columns and the authentication token are never part of the public contract.
example: |
  {
    "id": "driver_A1b2C3d4E5",
    "user": "user_1A2b3C4d5E",
    "internal_id": "DRV-1001",
    "company": "company_6zV1KqN9pR",
    "company_name": "Fleetbase",
    "name": "Alex Driver",
    "email": "alex.driver@example.com",
    "phone": "+15555550111",
    "timezone": "Asia/Singapore",
    "drivers_license_number": null,
    "license_expiry": null,
    "vehicle_id": null,
    "vendor_id": null,
    "job_id": null,
    "photo_url": null,
    "avatar_url": null,
    "vehicle_avatar": null,
    "location": {
      "latitude": 1.3521,
      "longitude": 103.8198
    },
    "heading": 0,
    "altitude": 0,
    "speed": 0,
    "country": "SG",
    "currency": "SGD",
    "city": "Singapore",
    "online": false,
    "current_status": null,
    "status": "active",
    "token": null,
    "skills": null,
    "max_travel_time": null,
    "max_distance": null,
    "time_window_start": null,
    "time_window_end": null,
    "meta": {},
    "updated_at": "2026-05-07T08:30:00.000000Z",
    "created_at": "2026-05-07T08:30:00.000000Z"
  }
fields:
  - name: id
    type: string
    description: Public driver identifier.
  - name: user
    type: string
    description: |-
      Public user ID linked to the driver. Always a string, never an object — Navigator uses it directly as a chat participant identifier and as a socket channel name.
  - name: internal_id
    type: string
    description: Optional internal identifier.
  - name: company
    type: string
    description: Public company ID for the driver's current company.
  - name: company_name
    type: string
    description: Name of the driver's current company.
  - name: name
    type: string
    description: Driver display name.
  - name: email
    type: string
    description: Driver email address.
  - name: phone
    type: string
    description: Driver phone number.
  - name: drivers_license_number
    type: string
    description: Driver license number.
  - name: photo_url
    type: string
    description: Driver photo URL.
  - name: avatar_url
    type: string
    description: Driver avatar URL.
  - name: vehicle
    type: object
    description: |-
      Assigned vehicle. Returned as an object by create, update and retrieve, which load it. Read `vehicle_id` for the identifier.
  - name: current_job
    type: object
    description: |-
      Current order. Returned as an object by create, update and retrieve, which load it. Read `job_id` for the identifier.
  - name: vendor
    type: object
    description: |-
      Assigned vendor. Returned as an object by create, update and retrieve, which load it. Read `vendor_id` for the identifier.
  - name: fleets
    type: array of objects
    description: Fleets the driver belongs to, when loaded.
  - name: location
    type: object
    description: Current driver coordinates.
  - name: heading
    type: integer
    description: Current heading in degrees.
  - name: altitude
    type: integer
    description: Current altitude.
  - name: speed
    type: integer
    description: Current speed.
  - name: country
    type: string
    description: Current country code.
  - name: currency
    type: currency
    description: Currency inferred from the driver's country.
  - name: city
    type: string
    description: Current city.
  - name: online
    type: boolean
    description: Whether the driver is online.
  - name: status
    type: string
    description: Driver lifecycle status.
  - name: token
    type: string
    description: Authentication token returned by driver login endpoints.
  - name: meta
    type: object
    description: Additional driver metadata.
  - name: updated_at
    type: timestamp
    description: Timestamp when the driver was last updated.
  - name: created_at
    type: timestamp
    description: Timestamp when the driver was created.
  - name: timezone
    type: string
    description: Timezone on the driver's linked user account.
  - name: license_expiry
    type: date
    description: Date the driver's licence expires.
  - name: vehicle_id
    type: string
    description: Public ID of the assigned vehicle, or `null`.
  - name: vendor_id
    type: string
    description: Public ID of the assigned vendor, or `null`.
  - name: job_id
    type: string
    description: Public ID of the driver's current order, or `null`.
  - name: bearing
    type: number
    description: Current bearing.
  - name: current_status
    type: string
    description: Free-form operational status, distinct from the lifecycle `status`.
  - name: skills
    type: array of strings
    description: Qualifications or certifications the driver holds, used for orchestrator assignment.
  - name: max_travel_time
    type: integer
    description: Maximum driving time per route, in seconds.
  - name: max_distance
    type: integer
    description: Maximum driving distance per route, in metres.
  - name: time_window_start
    type: string
    description: Default shift start time.
  - name: time_window_end
    type: string
    description: Default shift end time.
