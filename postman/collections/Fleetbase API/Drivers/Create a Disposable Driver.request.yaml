$kind: http-request
name: "Create a Disposable Driver"
description: |-
  Creates a throwaway driver purely so `Delete a Driver` has
  something to delete. Without it the delete destroys `{{driver_id}}`, which
  later requests in this and other folders still depend on — leaving them to
  404 against a deleted record.
url: "{{base_url}}/{{namespace}}/drivers"
method: POST
headers:
  Accept: application/json
body:
  type: json
  content: |
    {
      "name": "John Doe",
      "email": "{{$randomEmail}}",
      "phone": "{{$randomPhoneNumber}}"
    }
scripts:
  - type: afterResponse
    code: |-
      var json_response = pm.response.json();
      let cv = pm.environment;

      cv.set("driver_id_disposable", json_response.id);
    language: text/javascript
order: 4999
