$kind: http-request
description: Deletes the credential-less driver created by **Create an Operational Driver**.
url: "{{base_url}}/{{namespace}}/drivers/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: "{{operational_driver_id}}"
    description: (Required) The public id of the `Driver`.
scripts:
  - type: afterResponse
    code: |-
      pm.test("Delete an Operational Driver succeeds", function () {
          pm.expect(pm.response.code, `got HTTP ${pm.response.code}`).to.be.oneOf([200, 204]);
      });
    language: text/javascript
order: 4900
