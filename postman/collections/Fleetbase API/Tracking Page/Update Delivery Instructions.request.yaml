$kind: http-request
name: "Update Delivery Instructions"
description: |-
  Saves the customer's delivery instructions for their part of the order (one text per customer, trimmed to 500 characters; empty clears it) and returns the full view with `instructions.text` updated. Needs a verified device, a signed-in customer of the delivery or staff of the owning company.

  Errors: `403` (`{ "error": "not_allowed" }`) when the company has not allowed customers to edit instructions (`visibility.instructions_edit`, off by default); `404` (`code: not_found`) for a number this page can't show or a caller without access.

  No API key; see the folder description. Requires Fleet-Ops with the public tracking page (on `main` since 2026-10-08).
url: "{{base_url}}/public/track/{{tracking_number}}/instructions"
method: PUT
headers:
  Accept: application/json
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "text": "Leave it with the concierge."
    }
scripts:
  - type: beforeRequest
    code: |-
      // Editing needs a verified device: the shared link (Redeem a Shared Tracking Link,
      // with customer_interactions_share_tracking declared) or a real tracking_code.
      // Without either the caller has no access and the documented answer is 404. With
      // access, customers may only edit instructions where the company switched it on,
      // and it is off by default, so the answer is 403 not_allowed. An environment
      // declaring tracking_instructions_edit as well expects the updated view.
      const verified = pm.environment.get('customer_interactions_share_tracking') || pm.environment.get('tracking_code') || pm.variables.get('tracking_code');
      if (!verified) {
          pm.variables.set('expected_status', 404);
      } else if (!pm.environment.get('tracking_instructions_edit')) {
          pm.variables.set('expected_status', 403);
      }
    language: text/javascript
order: 6000
