$kind: http-request
name: "Redeem a Shared Tracking Link"
description: |-
  Opens a link a rider shared with `Share a Customer Order`, so the person they sent it to can follow the trip live without a code. The page passes on the link's `share` query value as `token`. A valid token gives this device the rider's view exactly as a verified code would: the answer is the full view (level 1, `viewer: verified`) and sets the `fb_track` cookie.

  The token is signed for that one order and rider and lasts 12 hours from when it was made. Errors: `422` (`{ "error": "invalid" }`) for a token that is malformed, expired or for another order or rider; `404` (`code: not_found`) for a number this page can't show; `429` (`{ "error": "limited", "retry_after" }`) after 10 code checks or redemptions a minute from one IP.

  No API key; see the folder description. Fleet-Ops v0.7.0 and later.
url: "{{base_url}}/public/track/{{tracking_number}}/share"
method: POST
headers:
  Accept: application/json
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "token": "{{tracking_share_token}}"
    }
order: 5000
