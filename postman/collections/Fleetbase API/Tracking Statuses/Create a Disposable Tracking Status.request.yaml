$kind: http-request
name: "Create a Disposable Tracking Status"
description: |-
  Creates a throwaway tracking status purely so `Delete a Tracking Status` has
  something to delete. Without it the delete destroys `{{tracking_status_id}}`, which
  later requests in this and other folders still depend on — leaving them to
  404 against a deleted record.
url: "{{base_url}}/{{namespace}}/tracking-statuses"
method: POST
headers:
  Accept: application/json
body:
  type: json
  content: |-
    {
        "status": "Delivery is en-route",
        "code": "delivery-en-route",
        "details": "Our driver has picked up your order and is on the way to your address!",
        "tracking_number": "{{tracking_number_id}}",
        "location": [1.3521, 103.8198],
        "city": "Singapore"
    }
scripts:
  - type: afterResponse
    code: |-
      var json_response = pm.response.json();
      let cv = pm.environment;

      if (json_response && typeof json_response.id === 'string') {
          cv.set("tracking_status_id_disposable", json_response.id);
      }
    language: text/javascript
order: 4999
