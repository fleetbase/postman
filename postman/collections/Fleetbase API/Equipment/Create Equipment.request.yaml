$kind: http-request
description: "Create equipment."
url: "{{base_url}}/{{namespace}}/equipment"
method: POST
body:
  type: json
  content: |-
    {
      "name": "Liftgate LG-12",
      "code": "LG-12",
      "type": "liftgate",
      "status": "available",
      "serial_number": "LG120045",
      "manufacturer": "Maxon",
      "model": "BMR",
      "currency": "USD"
    }
scripts:
  - type: afterResponse
    code: |
      var json_response = pm.response.json();
      let cv = pm.environment;
      cv.set("equipment_id", json_response.id);
    language: text/javascript
order: 1000
examples: ./.resources/Create Equipment.resources/examples
