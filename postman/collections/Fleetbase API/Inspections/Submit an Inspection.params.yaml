$kind: params
fields:
  - name: inspection_form
    type: string
    required: true
    description: ID of the published inspection form being filed against.
  - name: driver
    type: string
    required: true
    description: ID of the driver filing the inspection.
  - name: vehicle
    type: string
    required: false
    description: ID of the vehicle inspected. Defaults to the vehicle the driver is assigned to.
  - name: started_at
    type: timestamp
    required: false
    description: When the driver began the inspection. Defaults to the time it is filed.
  - name: odometer
    type: integer
    required: false
    description: Odometer reading at the time of the inspection.
  - name: engine_hours
    type: integer
    required: false
    description: Engine hours at the time of the inspection.
  - name: answers
    type: array of objects
    required: false
    description: "One entry per field the driver answered. Required unless a flat `item_results` body is sent instead; when both arrive the answers win. `custom_field_values` is accepted as the previous name for this field."
    fields:
      - name: field
        type: string
        required: true
        description: The field being answered, named by the `id` the form read gave it. Its `name` is accepted too.
      - name: value
        type: any
        required: true
        description: "The answer. A `pass-fail` field takes an object of `passed`, `not_applicable`, `severity`, `comments`, `photos` and `unsafe`; a meter takes a number; a signature or photo takes a base64 encoded image or a URL; everything else takes its plain value."
      - name: value_type
        type: string
        required: false
        description: How to store the value — `object`, `number`, `boolean`, `text` or `file`. Derived from the field's own type when omitted.
  - name: item_results
    type: array of objects
    required: false
    description: The first cut's flat checklist body, still accepted for older app builds and the tokenised public link. Required only when no `answers` are sent.
    fields:
      - name: item_key
        type: string
        description: The form item's key.
      - name: label
        type: string
        required: true
        description: The item as shown to the driver.
      - name: category
        type: string
        description: The item's category on the form.
      - name: passed
        type: boolean
        required: true
        description: Whether the item passed.
      - name: status
        type: string
        description: "`passed` or `failed`. Derived from `passed` when omitted."
      - name: severity
        type: string
        description: "Severity of a failure — `low`, `medium`, `high` or `critical`. Sets the priority of the issue and work order raised."
      - name: comments
        type: string
        description: The driver's note on the item.
      - name: photos
        type: array
        description: Photos of the item, each a base64 encoded image or a URL.
  - name: location
    type: object
    required: false
    description: Where the inspection was filed from, as `latitude` and `longitude`.
  - name: signature
    type: object
    required: false
    description: The driver's signature, as the app captured it.
  - name: attachments
    type: array
    required: false
    description: Additional files attached to the inspection.
