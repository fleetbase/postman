fields:
  - name: id
    type: string
    description: Public inspection identifier.
  - name: form
    type: object
    description: The inspection form the report was filed against, when loaded.
  - name: vehicle
    type: object
    description: The vehicle inspected, when loaded.
  - name: driver
    type: object
    description: The driver who filed the inspection, when loaded.
  - name: issue
    type: object
    description: The issue raised from the failed items, when the form asks for one and any item failed.
  - name: work_order
    type: object
    description: The work order opened for the failed items, when the form asks for one and any item failed.
  - name: custom_field_values
    type: array of objects
    description: The driver's answer to each field of the form — the field's `custom_field` id, `name`, `label`, `type` and `value_type` beside the `value`. A `pass-fail` value is an object of `passed`, `not_applicable`, `severity`, `comments`, `photos` and `unsafe`; a photo or signature value is resolved to `{ id, url, filename, content_type }` rather than the base64 that was sent.
  - name: files
    type: array of objects
    description: The photos and signatures filed with the inspection, however they arrived — inside the submit body, or dropped on the console's Photos panel.
  - name: item_results
    type: array of objects
    description: One result per `pass-fail` answer, derived from `custom_field_values` — `item_key`, `label`, `category`, `status` (`passed`, `failed` or `not_applicable`), `severity`, `passed`, `comments` and `photos`. This is what issues, work orders and the vehicle's history are built from.
  - name: type
    type: string
    description: Inspection type, taken from the form — `dvir`, `pre_trip`, `post_trip`, or a custom type.
  - name: status
    type: string
    description: Lifecycle status — `submitted`, `needs_review` or `resolved`.
  - name: result
    type: string
    description: "`passed` when every item passed, otherwise `failed`."
  - name: source
    type: string
    description: How it was filed — `navigator` for the driver app, `public_link` for a tokenised link.
  - name: odometer
    type: number
    description: Odometer reading at the time of the inspection.
  - name: engine_hours
    type: number
    description: Engine hours at the time of the inspection.
  - name: total_items
    type: integer
    description: Number of item results.
  - name: failed_items
    type: integer
    description: Number of item results that did not pass.
  - name: location
    type: object
    description: Where the inspection was filed from.
  - name: signature
    type: object
    description: The driver's signature, as the app captured it.
  - name: attachments
    type: array
    description: Additional files attached to the inspection.
  - name: has_failures
    type: boolean
    description: Whether any item failed.
  - name: started_at
    type: timestamp
    description: When the driver began the inspection.
  - name: submitted_at
    type: timestamp
    description: When the inspection was filed.
  - name: resolved_at
    type: timestamp
    description: When the failed items were resolved from the console, if they have been.
  - name: updated_at
    type: timestamp
    description: Timestamp when the inspection was last updated.
  - name: created_at
    type: timestamp
    description: Timestamp when the inspection was created.
