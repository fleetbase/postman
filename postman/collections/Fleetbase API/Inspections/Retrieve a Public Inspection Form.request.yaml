$kind: http-request
name: "Retrieve a Public Inspection Form"
description: |-
  Retrieves a published inspection form through a public inspection link, for whoever holds the link — a driver or a contractor with no Fleetbase account, filling the form in on a phone.

  A link is minted from the console for one form, and optionally assigned to one user and made for one driver and one vehicle. Send its token as `token` in the query string, and its PIN in the `X-Inspection-Pin` header. No API key is needed, and one sent is ignored. These routes are mounted at the application root, with no namespace, and are rate limited to 60 requests a minute per IP address.

  The response carries the `form` — the same shape Retrieve an Inspection Form answers with, its `grouped_fields` being what to render and answer — and an `identity`: the `assignee` the link is for as `{ id, name }`, the `driver` it was minted for as `{ id, name }`, the `vehicle` as `{ id, name, plate_number }`, each `null` when the link names none, and the link's `expires_at`. The driver's phone number is deliberately not included: whoever holds the link needs to know who it is for, not how to reach them.

  A token that is missing, unknown, expired, revoked or — for a single-use link — already used answers 403 with an `error`. Reading the form does not spend a single-use link; submitting does.

  Every link carries a six-digit PIN, generated with it: shown in the console, or sent by email or SMS with the link to the user the link is assigned to, else to the driver. The PIN stops anyone who has the link alone. The same PIN is asked for by all three public routes. Without it, every one answers 403 with `pin_required: true`; a wrong one answers the same with `attempts_left`, and the fifth wrong PIN locks the link, which then answers 403 with `locked: true` until a new link is generated. Links minted before PINs existed carry none and ask for none. A `pin` field is accepted too, but the header keeps the PIN out of URLs and the access logs that record them.
url: "{{base_url}}/public/inspections/forms/:id"
method: GET
# No auth block. The route is public and ignores Authorization, so the collection's
# inherited bearer is harmless here. A request-level `auth:` mapping is only proven
# in this repository for overriding one bearer with another (Organizations/List
# Organizations); there is no verified shape here for clearing auth, and a wrong
# shape drops the request from the collection.
pathVariables:
  - key: id
    value: "{{inspection_link_form_id}}"
    description: (Required) The published form the link was minted for.
headers:
  X-Inspection-Pin: "{{inspection_link_pin}}"
queryParams:
  token: "{{inspection_link_token}}"

scripts:
  - type: afterResponse
    code: |-
      // Upload a Public Inspection Photo and Submit a Public Inspection answer this
      // form, so its groups are chained from here as JSON. Cleared to an empty list
      // when the read fails, rather than left holding a previous run's fields.
      const json_response = pm.response.json();
      const form = (json_response && json_response.form) ? json_response.form : null;

      pm.test("Retrieve a Public Inspection Form answers the form and who it is for", function () {
          pm.expect(pm.response.code, `got HTTP ${pm.response.code}`).to.eql(200);
          pm.expect(form, "no form returned").to.be.an("object");
          pm.expect(form.id, "the form has no id").to.be.a("string").and.not.empty;
          pm.expect(json_response, "no identity returned").to.have.property("identity");
          pm.expect(json_response.identity, "the identity does not say who the link is for").to.have.property("assignee");
      });

      pm.test("The identity names the driver without their phone number", function () {
          const identity = json_response ? json_response.identity : null;
          const driver = identity ? identity.driver : null;

          if (driver === null || driver === undefined) {
              return;
          }

          pm.expect(driver, "a public link must not disclose the driver's phone").to.not.have.property("phone");
      });

      const groups = (form && Array.isArray(form.grouped_fields)) ? form.grouped_fields : [];
      pm.environment.set("public_inspection_form_fields", JSON.stringify(groups));
    language: text/javascript

order: 7000
