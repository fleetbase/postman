$kind: http-request
name: "Upload a Public Inspection Photo"
description: |-
  Uploads a photo or a signature through a public inspection link, so a `pass-fail` photo slot, a `file-upload` field or a `signature` field can be answered by someone who has no Fleetbase session.

  Send the link's `token` as a form field, as here, or in the query string, and its PIN in the `X-Inspection-Pin` header. The body is multipart form data: the `file`, which must be an image of at most 10 MB, and optionally a `type` of `inspection_photo` (the default) or `inspection_signature`. Uploads are rate limited to 20 a minute, and one link can take a limited number of files in all.

  The response is the stored `file` as `{ id, url, filename, content_type }`. Answer a field with it by sending `"file:" + file.id` as the value in Submit a Public Inspection. A file is only accepted by a submission through the same link it was uploaded through; any other file id answers 422.

  A token that is missing, unknown, expired, revoked or already used answers 403 with an `error`, as does a missing or wrong PIN or a locked link.
url: "{{base_url}}/public/inspections/forms/:id/files"
method: POST
# No auth block — see Retrieve a Public Inspection Form. The inherited bearer is ignored.
pathVariables:
  - key: id
    value: "{{inspection_link_form_id}}"
    description: (Required) The published form the link was minted for.
headers:
  X-Inspection-Pin: "{{inspection_link_pin}}"
body:
  type: formdata
  content:
    - type: file
      key: file
      # Path is resolved against the CLI's process working directory, and --working-dir
      # does not change that — so it is written relative to the repo root, which is where
      # you run the collection from. The same image Files/Upload File sends.
      src: "postman/collections/Fleetbase Core API/Files/sample-upload.png"
    - type: text
      key: token
      value: "{{inspection_link_token}}"
    - type: text
      key: type
      value: "inspection_photo"

scripts:
  - type: afterResponse
    code: |-
      // Submit a Public Inspection answers the form's file-upload and signature
      // fields with this file. Cleared when the upload fails, so the submit does
      // not reference a previous run's file — which the server would refuse
      // with a 422 for belonging to another link, hiding the real failure here.
      const json_response = pm.response.json();
      const file = (json_response && json_response.file) ? json_response.file : {};

      if (typeof file.id === "string" && file.id.indexOf("file_") === 0) {
          pm.environment.set("public_inspection_file_id", file.id);
      } else {
          pm.environment.unset("public_inspection_file_id");
      }

      pm.test("Upload a Public Inspection Photo stores the image as a file", function () {
          pm.expect(pm.response.code, `got HTTP ${pm.response.code}`).to.eql(200);
          pm.expect(file.id, "the stored file has no public id").to.be.a("string").and.match(/^file_/);
      });
    language: text/javascript

order: 8000
