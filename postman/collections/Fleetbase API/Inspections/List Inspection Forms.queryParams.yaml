$kind: queryParams
fields:
  - name: vehicle
    type: string
    required: false
    description: Only forms that apply to this vehicle — bound to it, or bound to no vehicle at all.
  - name: type
    type: string
    required: false
    description: Only forms of these types, such as `dvir` or `pre_trip,post_trip`.
  - name: limit
    type: integer
    required: false
    description: Maximum forms to return. Defaults to 30.
