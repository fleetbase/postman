$kind: http-request
description: |-
  Commits a proposed orchestrator plan by creating manifests and applying vehicle and driver assignments to orders. Assignment records must use public resource IDs.

  This endpoint is engine-agnostic: commit the `assignments` returned by route-aware VROOM, VROOM capacity-only, native capacity-only, or multi-phase orchestration runs. Do not submit internal UUIDs or database IDs.
url: "{{base_url}}/{{namespace}}/orchestrator/commit"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |
    {
      "scheduled_date": "2026-05-16",
      "assignments": [
        {
          "order_id": "{{order_id}}",
          "vehicle_id": "{{vehicle_id}}",
          "driver_id": "{{driver_id}}",
          "sequence": 1,
          "arrival": 1778918400,
          "duration": 900,
          "distance": 4200
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      // Commit is what creates a manifest, and the id it returns is the only
      // place the Manifests folder can get one — there is no endpoint that
      // creates a manifest directly.
      const json_response = pm.response.json();
      const manifests = json_response.manifests || [];

      if (manifests.length) {
          pm.environment.set("manifest_id", manifests[0]);
      }
    language: text/javascript

examples: ./.resources/Commit Orchestrator Plan.resources/examples
order: 2000
