$kind: http-request
description: "Get Driver Geofence History"
url: "{{base_url}}/{{namespace}}/geofences/driver/:driverId/history"
method: GET

pathVariables:
  - key: driverId
    value: "{{driver_id}}"
    description: (Required) The driver's public id.

queryParams:
  per_page: "50"
order: 4000
