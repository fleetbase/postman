$kind: http-request
description: "Renders a PDF, text, or base64 label for an order, waypoint, or entity id."
url: "{{base_url}}/{{namespace}}/labels/:id"
method: GET

pathVariables:
  - key: id
    value: "{{order_id}}"
    description: The order, waypoint or entity to render a label for, matching `type` below.

queryParams:
  format: "stream"
  type: "order"
order: 1000
