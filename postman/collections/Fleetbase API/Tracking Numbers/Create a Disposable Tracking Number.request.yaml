$kind: http-request
name: "Create a Disposable Tracking Number"
description: |-
  Creates a throwaway tracking number purely so `Delete a Tracking Number` has
  something to delete. Without it the delete destroys `{{tracking_number_id}}`, which
  later requests in this and other folders still depend on — leaving them to
  404 against a deleted record.
url: "{{base_url}}/{{namespace}}/tracking-numbers"
method: POST
headers:
  Accept: application/json
body:
  type: json
  content: |-
    {
        "region": "SG",
        "owner": "{{order_id}}"
    }
scripts:
  - type: afterResponse
    code: |-
      var json_response = pm.response.json();
      let cv = pm.environment;
      cv.set("tracking_number_id_disposable", json_response.id);
    language: text/javascript
order: 3999
