$kind: http-request
description: Create a product
url: "{{base_url}}/{{api_prefix}}/{{namespace}}/products"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Steel Shelving Bracket",
      "sku": "SSB-{{$timestamp}}",
      "unit_cost": 4.50,
      "unit_price": 9.00,
      "reorder_point": 25
    }
scripts:
  - type: afterResponse
    code: |
      // Later requests address {{product_id}}; nothing else sets it.
      const body = pm.response.json();
      const captured = body.id;
      if (captured) { pm.environment.set("product_id", captured); }
    language: text/javascript
order: 1000
