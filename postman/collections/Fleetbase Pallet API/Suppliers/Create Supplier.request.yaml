$kind: http-request
description: Create a supplier
url: "{{base_url}}/{{api_prefix}}/{{namespace}}/suppliers"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Acme Supply Co",
      "email": "ops@acme.example"
    }
scripts:
  - type: afterResponse
    code: |
      // Later requests address {{supplier_id}}; nothing else sets it.
      const body = pm.response.json();
      const captured = body.id;
      if (captured) { pm.environment.set("supplier_id", captured); }
    language: text/javascript
order: 1000
