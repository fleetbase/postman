$kind: http-request
description: Create an order with its lines
url: "{{base_url}}/{{api_prefix}}/{{namespace}}/purchase-orders"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "supplier": "{{supplier_id}}",
      "warehouse": "{{warehouse_id}}",
      "reference_code": "PO-{{$timestamp}}",
      "items": [
        { "product": "{{product_id}}", "quantity": 20, "unit_price": 5.00 }
      ]
    }
scripts:
  - type: afterResponse
    code: |
      // Later requests address {{purchase_order_id}}; nothing else sets it.
      const body = pm.response.json();
      const captured = body.id;
      if (captured) { pm.environment.set("purchase_order_id", captured); }
    language: text/javascript
order: 1000
