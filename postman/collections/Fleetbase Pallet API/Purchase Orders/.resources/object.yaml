$kind: object
name: Purchase Order
description: |-
  An order placed with a supplier, and the lines it consists of.
example: |
  {
    "id": "purchase_order_v4w5x6",
    "object": "purchase_order",
    "status": "partial",
    "supplier": "supplier_d4e5f6",
    "supplier_name": "Acme Supply Co",
    "warehouse": "warehouse_x1y2z3",
    "reference_code": "PO-{{$timestamp}}",
    "total_value": 100.00,
    "expected_delivery_at": "2026-09-01T00:00:00Z",
    "items": [
      {
        "id": "poi_y7z8a9",
        "object": "purchase_order_item",
        "product": "product_a1b2c3",
        "sku": "SSB-{{$timestamp}}",
        "quantity": 20,
        "quantity_received": 12,
        "outstanding_quantity": 8,
        "unit_price": 5.00,
        "status": "partial"
      }
    ],
    "created_at": "2026-08-20T09:00:00Z",
    "updated_at": "2026-08-20T14:30:00Z"
  }
fields:
  - name: id
    type: string
    description: "Public identifier of the order."
  - name: status
    type: string
    description: "pending, partial, received or cancelled."
  - name: supplier
    type: string
    description: "Public id of the supplier."
  - name: items
    type: array of objects
    description: "Order lines, each with its outstanding quantity."
  - name: total_value
    type: number
    description: "Total value of the order."
