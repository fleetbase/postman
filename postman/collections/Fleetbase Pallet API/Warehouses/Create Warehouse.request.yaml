$kind: http-request
description: Create a warehouse
url: "{{base_url}}/{{api_prefix}}/{{namespace}}/warehouses"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Singapore Distribution Center",
      "code": "SG-DC-{{$timestamp}}"
    }
scripts:
  - type: afterResponse
    code: |
      // Later requests address {{warehouse_id}}; nothing else sets it.
      const body = pm.response.json();
      const captured = body.id;
      if (captured) { pm.environment.set("warehouse_id", captured); }
    language: text/javascript
order: 1000
