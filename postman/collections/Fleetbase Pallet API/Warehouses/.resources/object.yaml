$kind: object
name: Warehouse
description: |-
  A facility holding stock.
example: |
  {
    "id": "warehouse_x1y2z3",
    "object": "warehouse",
    "name": "Singapore Distribution Center",
    "code": "SG-DC-{{$timestamp}}",
    "type": "distribution",
    "status": "active",
    "capacity": 5000,
    "total_docks": 8,
    "is_active": true,
    "is_default": false,
    "stock_item_count": 1,
    "address": "1 Logistics Way, Singapore",
    "created_at": "2026-07-14T08:00:00Z",
    "updated_at": "2026-08-19T11:02:00Z"
  }
fields:
  - name: id
    type: string
    description: "Public identifier of the warehouse."
  - name: name
    type: string
    description: "Warehouse name."
  - name: code
    type: string
    description: "Short code for the facility."
  - name: capacity
    type: number
    description: "Storage capacity."
  - name: stock_item_count
    type: integer
    description: "Distinct stock records held, present on list and retrieve."
  - name: address
    type: string
    description: "Flattened address of the warehouse's place, when one is set."
