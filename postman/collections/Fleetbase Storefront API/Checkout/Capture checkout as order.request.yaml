$kind: http-request
description: |-
  Captures a checkout token and creates the corresponding order. The response returns the completed order or the existing order when the checkout was already captured.
url: "{{base_url}}/{{api_prefix}}/{{namespace}}/checkouts/capture"
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "token": "{{checkout_token}}"
    }
scripts:
  - type: afterResponse
    code: |-
      // Complete Order Pickup and Get Order Receipt both address {{order_id}}, and this is
      // the only request that creates a storefront order. Nothing set it.
      var json_response = pm.response.json();

      if (json_response && json_response.id) {
          pm.environment.set("order_id", json_response.id);
      }
    language: text/javascript
order: 3000
