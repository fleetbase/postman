$kind: params
fields:
  - name: gateway
    type: string
    description: "Payment gateway ID or code."
  - name: customer
    type: string
    description: "Customer public ID for guest checkout. When Customer-Token is present this value must identify the authenticated customer or checkout returns 403."
  - name: cart
    type: string
    description: "Cart public ID or unique identifier. Network checkout validates member stores, online state, products, locations, currency consistency, and the network multi-cart policy before payment initialization."
  - name: service_quote
    type: string
    description: "Service quote ID used by the request."
  - name: cash
    type: boolean
    description: "Cash value for this checkout request."
  - name: pickup
    type: boolean
    description: "Pickup address, place ID, or pickup payload for the order."
  - name: tip
    type: number
    description: "Tip amount applied to the checkout."
  - name: delivery_tip
    type: number
    description: "Tip amount allocated to delivery."
