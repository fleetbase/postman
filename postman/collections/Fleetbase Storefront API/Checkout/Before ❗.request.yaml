$kind: http-request
description: |-
  Initializes a checkout preview for a cart, customer, gateway, and delivery or pickup option. The response prepares gateway-specific client data or a checkout token before the order is captured.

  Stock and booked slots are checked when the checkout is created (cash, Stripe and QPay alike, and again when `Update Stripe Payment Intent` creates or re-prices a checkout). For products that track inventory, each line's quantity is held at the line's store location or food truck for 15 minutes and taken when the order is captured; an abandoned checkout gives it back. A refusal deletes the checkout:

  - `422` `{ "errors": ["Some items in your cart are no longer available."], "code": "cart_items_unavailable", "items": [{ "id", "product_id", "name", "available" }] }` when a tracked product doesn't have enough stock at the line's location. `id` is the cart line and `available` is what is left to sell there.
  - `422` `{ "errors": ["The time you picked for <service> was just booked. Please pick another time."], "code": "booking_slot_unavailable" }` when a booked service's slot (see `List Product Booking Slots`) has no places left.

  Promotions are priced when the checkout is created: automatic promotions and any promo codes (from `promo_codes` or applied to the cart) are subtracted from the amount charged, and each use is reserved for the checkout. A code that cannot be applied refuses the checkout with `400`.

  The response depends on the gateway: cash returns `{ checkout, token }`, Stripe returns `{ paymentIntent, clientSecret, ephemeralKey, customerId, checkout, token }`, and QPay returns `{ invoice, checkout, token }`. When realtime socket authentication is enabled, every response also carries `socket_token`: a token scoped to the realtime channel `checkout.{checkout}`, which a guest uses to receive payment and order updates (see the Checkout object).

  Errors: `403` when `customer` does not match the authenticated customer; `400` when no gateway is configured or a promo code cannot be applied; for Network carts, `422`/`403` when the cart is empty, has a store outside the network or offline, mixes stores without multi-store carts, has an unavailable product or location, or mixes currencies.
url: "{{base_url}}/{{api_prefix}}/{{namespace}}/checkouts/before"
method: GET
queryParams:
  # `gateway` is the gateway CODE, not an id — "stripe", "cash", or whichever code the
  # store has configured. CheckoutController resolves it with Storefront::findGateway().
  gateway: "stripe"
  customer: "{{customer_id}}"
  cart: "{{cart_id}}"
  service_quote: "{{service_quote_id}}"
  pickup: "false"
scripts:
  - type: afterResponse
    code: |-
      // This response is the only source for three variables the rest of Checkout
      // addresses, and nothing set any of them.
      //
      //   {{checkout_token}}     Capture checkout as order, Get Checkout Status
      //   {{checkout_id}}        Get Checkout Status, both QPay callbacks. This is the
      //                          chkt_* public id, NOT the token — /checkouts/status
      //                          matches on both and they are different values.
      //   {{payment_intent_id}}  Update Stripe Payment Intent
      //
      // Only the card gateway returns a payment intent, so that capture is guarded
      // rather than assumed: a cash or pickup checkout answers with the ids alone.
      var json_response = pm.response.json();

      if (json_response && json_response.token) {
          pm.environment.set("checkout_token", json_response.token);
      }

      if (json_response && json_response.checkout) {
          pm.environment.set("checkout_id", json_response.checkout);
      }

      if (json_response && json_response.paymentIntent) {
          pm.environment.set("payment_intent_id", json_response.paymentIntent);
      }
    language: text/javascript
order: 1000
