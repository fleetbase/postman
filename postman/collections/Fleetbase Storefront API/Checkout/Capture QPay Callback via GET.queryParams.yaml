$kind: params
fields:
  - name: checkout
    type: string
    required: true
    description: "Public checkout ID (`chkt_…`) the invoice was created for."
  - name: respond
    type: boolean
    description: "Return `{ checkout, payment, error }` as JSON instead of QPay's plain-text `SUCCESS`."
  - name: test
    type: enum
    values: ["success", "error"]
    description: "Sandbox only. Simulate a paid (`success`) or unpaid (`error`) callback."
