$kind: params
fields:
  - name: checkout
    type: string
    required: true
    description: "Public checkout ID being confirmed by QPay."
  - name: respond
    type: boolean
    description: "Return `{ checkout, payment, error }` as JSON instead of QPay's plain-text `SUCCESS`."
  - name: test
    type: enum
    values: ["success", "error"]
    description: "Sandbox-only test scenario to simulate."
