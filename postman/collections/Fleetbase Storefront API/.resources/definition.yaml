$kind: collection
description: |-
  Storefront and customer-facing commerce endpoints, used by the Storefront customer app and website.

  # Authentication

  Every request sends the store or network key (`store_...` or `network_...`) as a bearer token. Endpoints that act for a signed-in customer also send that customer's token in the `Customer-Token` header.

  # Localization

  Storefront v0.4.30 and later answer in the language of the `Accept-Language` request header. The supported languages are English (`en`), Mongolian (`mn`) and Ukrainian (`uk`).

  - Regional codes match their language (`mn-MN` is `mn`, `en-US` is `en`), and quality values are honoured (`mn-MN,en;q=0.5`).
  - An unsupported language gets English. A request without the header gets the server default, English.
  - The language applies to human-readable text: `error` messages, validation messages, and SMS or email verification codes sent by the request.
  - Status codes, error codes (such as `"code": "booking_slot_unavailable"`), response shapes and merchant content (store and product names) are not translated.

  When a request carries a `Customer-Token`, the language is also stored on that customer. Their order notifications (push, inbox and email) and order chat pushes are sent in it, including notifications sent later from the queue. A customer who has never sent the header gets English.

  In the Postman collection, set the `locale` variable (for example `mn`) to send `Accept-Language` with every request. Leave it empty to send none.
variables:
  storefront_key: ""
  customer_token: ""
  base_url: ""
  namespace: v1
  api_prefix: storefront
  api_key: ""
  locale: ""
scripts:
  - type: http:beforeRequest
    code: |
      // Sends the collection's `locale` as Accept-Language, so the API answers in that
      // language (en, mn or uk). Left empty, no header is sent and the API answers in English.
      const locale = pm.variables.get('locale');
      if (locale) {
          pm.request.headers.upsert({ key: 'Accept-Language', value: locale });
      }
    language: text/javascript
  - type: http:afterResponse
    code: |
      // Baseline contract assertions, applied to every request in this collection.
      //
      // Status is asserted explicitly against a list. The obvious-looking
      // `pm.expect(pm.response).to.be.ok` is chai's truthiness check on an object and
      // is therefore true for every response, including a 400 — it asserts nothing.
      //
      // A request whose CONTRACT is a refusal (e.g. capturing an unpaid Stripe checkout
      // must answer 402) opts out of the 2xx expectation by setting `expected_status`
      // in its beforeRequest script. The error-payload check is skipped for it too —
      // the error body is exactly what such a request is asserting.
      //
      // The override is consumed here, immediately after being read. "Local" variables
      // are scoped to the RUN, not the request — left set, one request's 402 override
      // held every later request in the run against [402], failing ten healthy 200s.
      const expectedOverride = Number(pm.variables.get('expected_status')) || null;
      pm.variables.unset('expected_status');
      const expected = expectedOverride
          ? [expectedOverride]
          : (pm.request.method === 'POST' ? [200, 201, 202] : [200, 201, 202, 204]);

      pm.test(`${pm.info.requestName} responds 2xx`, function () {
          pm.expect(pm.response.code, `got HTTP ${pm.response.code}`).to.be.oneOf(expected);
      });

      pm.test(`${pm.info.requestName} returns a JSON body`, function () {
          pm.expect(pm.response.headers.get('Content-Type') || '').to.include('json');
          pm.expect(() => pm.response.json(), 'body is not parseable JSON').to.not.throw();
      });

      // A 2xx carrying {"error": ...} or {"errors": [...]} is still a failure; the API
      // returns that shape for several handled conditions.
      //
      // An explicitly NULL error is not one of them. Storefront's QPay callback always
      // answers with the same envelope — {checkout, payment, error} — and reports success
      // by setting error to null. Asserting on the key's presence failed that, which is
      // the opposite of what this test is for. Anything non-null still fails, and so does
      // a non-empty errors array.
      const isEmptyError = (value) =>
          value === null || value === undefined ||
          (Array.isArray(value) && value.length === 0);

      pm.test(`${pm.info.requestName} returns no error payload`, function () {
          if (expectedOverride) { return; }
          let body;
          try { body = pm.response.json(); } catch (e) { return; }
          if (body === null || typeof body !== 'object') { return; }
          pm.expect(isEmptyError(body.error), `response carries an "error": ${JSON.stringify(body.error)}`).to.be.true;
          pm.expect(isEmptyError(body.errors), `response carries an "errors": ${JSON.stringify(body.errors)}`).to.be.true;
      });
    language: text/javascript
auth:
  - id: e8d21b47-4c30-4757-baa3-e0e5492aba20
    type: bearer
    name: bearer auth
    credentials:
      token: "{{storefront_key}}"
