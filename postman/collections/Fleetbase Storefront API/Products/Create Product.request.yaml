$kind: http-request
description: Create Product
url: "{{base_url}}/{{api_prefix}}/{{namespace}}/products"
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Example Product",
      "description": "Example storefront product",
      "price": 1000
    }
scripts:
  - type: afterResponse
    code: |
      // Retrieve and Update Product address {{product_id}}; nothing set it.
      var json_response = pm.response.json();
      let cv = pm.environment;
      cv.set("product_id", json_response.id);
    language: text/javascript
order: 2000