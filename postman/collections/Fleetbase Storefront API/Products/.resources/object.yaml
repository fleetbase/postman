$kind: object
name: Product
description: |-
  A product is an item or service sold through a storefront, including pricing, availability, media, variants, addons, and tags.
example: |
  {
    "id": "product_9Lb2mQ1",
    "name": "Cold Brew",
    "description": "Bottled cold brew coffee.",
    "sku": "CB-12",
    "primary_image_url": "https://files.example.com/cold-brew.png",
    "price": 450,
    "sale_price": null,
    "currency": "USD",
    "is_on_sale": false,
    "is_recommended": true,
    "is_service": false,
    "is_bookable": false,
    "is_available": true,
    "track_inventory": true,
    "inventory": {
      "tracked": true,
      "in_stock": true,
      "available_total": 3,
      "low": true,
      "locations": [
        { "id": "inventory_4Kd9wP2", "location": "store_location_7Nx2bQ5", "location_type": "store_location", "quantity": 5, "reserved": 2, "available": 3, "low_stock_threshold": 5, "allow_backorder": false, "low": true }
      ]
    },
    "in_stock": true,
    "tags": ["coffee"],
    "status": "published",
    "meta": {},
    "slug": "cold-brew",
    "translations": [],
    "addon_categories": [
      {
        "id": "category_2Fd8kL1",
        "name": "Extras",
        "description": null,
        "is_required": false,
        "max_selectable": 2,
        "excluded_addons": [],
        "addons": [
          { "id": "product_addon_5Gh7jK2", "name": "Oat milk", "description": null, "price": 80, "sale_price": null, "is_on_sale": false }
        ]
      }
    ],
    "variants": [],
    "images": [],
    "videos": [],
    "hours": [],
    "youtube_urls": [],
    "created_at": "2026-05-07T09:30:00Z",
    "updated_at": "2026-05-07T09:30:00Z"
  }
fields:
  - name: id
    type: string
    description: "Public identifier of the product."
  - name: name
    type: string
    description: "Product name."
  - name: description
    type: string
    description: "Product description."
  - name: sku
    type: string
    description: "Stock keeping unit."
  - name: primary_image_url
    type: string
    description: "Primary product image URL."
  - name: price
    type: integer
    description: "Product price."
  - name: sale_price
    type: integer
    description: "Sale price when the product is on sale."
  - name: currency
    type: currency
    description: "Product currency code."
  - name: is_available
    type: boolean
    description: "Whether the product is available for purchase."
  - name: track_inventory
    type: boolean
    description: "Whether the store tracks stock for this product. Off by default; products that don't track stock are never limited by it."
  - name: inventory
    type: object
    description: "Stock as clients show it: `{ tracked, in_stock, available_total, low, locations }`. Untracked products return `{ \"tracked\": false, \"in_stock\": true, \"available_total\": null, \"low\": false, \"locations\": [] }`. Each location is `{ id, location, location_type, quantity, reserved, available, low_stock_threshold, allow_backorder, low }`: `location` is the store location or food truck public ID and `location_type` is `store_location` or `food_truck`; `quantity` is on hand, `reserved` is held by checkouts in progress (for 15 minutes), `available` is what can still be sold, and `low` is true while some stock is available but no more than `low_stock_threshold`. `in_stock` is true when any location has stock available or allows backorders."
  - name: in_stock
    type: boolean
    description: "Whether the product can be sold now: false when `is_available` is false, or when it tracks stock and no location has any available (or allows backorders). Use it for out of stock labels; `inventory.available_total` for \"only N left\"."
  - name: tags
    type: array of strings
    description: "Product tags."
  - name: status
    type: string
    description: "Product status."
  - name: meta
    type: object
    description: "Arbitrary metadata stored with the product."
  - name: addon_categories
    type: array of objects
    description: "Addon categories available for the product: `id`, `name`, `description`, `is_required` (the customer must choose at least one), `max_selectable` (most add-ons that can be chosen, or null for no limit), `excluded_addons` and `addons`."
  - name: variants
    type: array of objects
    description: "Product variants and options."
  - name: images
    type: array of strings
    description: "Product image URLs."
  - name: videos
    type: array of strings
    description: "Product video URLs."
  - name: hours
    type: array of objects
    description: "Product availability hours."
  - name: created_at
    type: timestamp
    description: "Time the product was created."
  - name: updated_at
    type: timestamp
    description: "Time the product was last updated."
