$kind: object
name: Notification
description: |-
  An inbox item. `type` identifies what the notification is about (for example `order_accepted`, `order_updated`, `order_item_unavailable`, `order_completed`, `promotional` or `campaign`), and `data` carries the identifiers the app needs to deep link. Recipient details are never included.
example: |
  {
    "id": "0f4c9a52-8d3f-4a6e-9f0e-2b1f7f2f8c11",
    "type": "order_completed",
    "title": "Your order from Acme Market has been delivered",
    "body": "Your order from Acme Market has been delivered, enjoy!",
    "image": null,
    "data": {
      "order_id": "order_9Kx2mQ1",
      "storefront_id": "store_3Xb9kL2",
      "store_id": "store_3Xb9kL2"
    },
    "is_read": false,
    "read_at": null,
    "created_at": "2026-09-26T09:30:00Z"
  }
fields:
  - name: id
    type: string
    description: "Notification id (uuid)."
  - name: type
    type: string
    description: "What the notification is about, e.g. `order_accepted`, `order_enroute`, `order_nearby`, `order_completed`, `order_canceled`, `order_ready`, `order_driver_assigned`, `order_activity`, `order_chat_message`, `order_updated` (the store edited the order or moved a booking), `order_item_unavailable` (the store marked an item unavailable), `order_balance_paid` (a balance due was paid by its payment link), `promotional` or `campaign`. `order_activity` covers order steps that have no notification of their own (and every step of a booking after it's requested); its title is the step's label. `order_chat_message` is a message from the driver (`data` has `order`, `order_id`, `chat_id`, `message_id`, `store_id`, `network_id`); it's always delivered, whatever the `order_updates` preference."
  - name: title
    type: string
    description: "Notification title."
  - name: body
    type: string
    description: "Notification message. For `order_updated` (the store edited the order) it says what changed and what that means for the customer's money: refunded, returned as store credit with the code to use, or a balance to pay with its payment link. A booking that was only moved says when it is now, in the store's time (`Deep Clean is now Mon 19 Oct, 11:00 to 12:00.`). For `order_item_unavailable` it names the item and says the store will replace or remove it and adjust the total. For `order_balance_paid` it gives the amount received and anything still left to pay. For `order_canceled` it gives the store's reason, when there is one, and whether the payment was refunded or returned as store credit."
  - name: image
    type: string
    description: "Optional image URL."
  - name: data
    type: object
    description: "Deep link data with null values removed, such as `order_id`, `store_id`, `network_id`, `promotion_id`, `campaign_id` and `action`/`action_id`/`action_url`."
  - name: is_read
    type: boolean
    description: "Whether the customer has read the notification."
  - name: read_at
    type: timestamp
    description: "When the notification was read."
  - name: created_at
    type: timestamp
    description: "When the notification was created."
