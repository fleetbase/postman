$kind: http-request
description: |-
  Retrieves one of the authenticated customer's notifications. Returns `404` for a notification that does not exist or belongs to another customer or storefront.
url: "{{base_url}}/{{api_prefix}}/{{namespace}}/notifications/{{notification_id}}"
method: GET
headers:
  - key: Customer-Token
    value: "{{customer_token}}"
scripts:
  - type: beforeRequest
    code: |-
      // Addresses the first notification returned by List Notifications. A fresh
      // stack has none, so without one this documents the not-found contract.
      if (!pm.environment.get('notification_id')) {
          pm.variables.set('notification_id', 'missing-notification');
          pm.variables.set('expected_status', 404);
      }
    language: text/javascript
order: 3000
