$kind: http-request
description: |-
  Lists the food trucks of the storefront: a store key returns that store's trucks; a network key returns the member stores' trucks and the network's own. Each truck includes its store, vehicle, zone, service area and catalogs.
url: "{{base_url}}/{{api_prefix}}/{{namespace}}/food-trucks"
method: GET
queryParams:
  limit: ""
  offset: ""
  sort: ""
scripts:
  - type: afterResponse
    code: |-
      // Retrieve Food Truck addresses {{food_truck_id}}; nothing set it.
      var json_response = pm.response.json();

      if (Array.isArray(json_response) && json_response.length) {
          pm.environment.set("food_truck_id", json_response[0].id);
      }
    language: text/javascript
order: 1000
