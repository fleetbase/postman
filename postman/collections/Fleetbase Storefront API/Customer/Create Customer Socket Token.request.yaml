$kind: http-request
description: |-
  Creates a short-lived token for the authenticated customer to authenticate the realtime (SocketCluster) connection. With it the customer may subscribe to their storefront's channel, their own checkouts (`checkout.{id}`) and the chats they take part in (`chat.{id}`, see Order Chat). Fetch a new one before `expires_at`.

  Response: `{ "token": "<JWT>", "expires_in": 900, "expires_at": "2026-10-12T10:15:00+00:00" }`. `expires_in` is in seconds (900 by default, at most 3600).

  Errors: `404` when the server doesn't have socket authentication enabled (clients then connect anonymously), `401` without a valid `Customer-Token` or for a customer of another company.
url: "{{base_url}}/{{api_prefix}}/{{namespace}}/customers/socket-token"
method: POST
headers:
  - key: Customer-Token
    value: "{{customer_token}}"
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {}
scripts:
  - type: beforeRequest
    code: |-
      // Socket authentication is off by default, and off in production until its rollout
      // reaches it; while it is off this endpoint answers 404 and clients connect
      // anonymously. That is the contract asserted unless the environment declares
      // socket_auth_enabled, in which case a token is expected.
      if (!pm.environment.get('socket_auth_enabled')) {
          pm.variables.set('expected_status', 404);
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
          var json_response = pm.response.json();
          pm.test('A socket token comes with its expiry', function () {
              pm.expect(json_response.token, 'token missing').to.be.a('string').and.not.empty;
              pm.expect(json_response.expires_in, 'expires_in missing').to.be.a('number');
              pm.expect(json_response.expires_at, 'expires_at missing').to.be.a('string').and.not.empty;
          });
      }
    language: text/javascript
order: 5150
