$kind: http-request
description: |-
  Returns the customer signed in with the `Customer-Token` header. A storefront key alone is refused with `401`: it does not list the company's customers.
url: "{{base_url}}/{{api_prefix}}/{{namespace}}/customers"
method: GET
headers:
  - key: Customer-Token
    value: "{{customer_token}}"
order: 6000
