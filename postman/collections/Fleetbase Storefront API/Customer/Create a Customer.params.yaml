$kind: params
fields:
  - name: code
    type: string
    required: true
    description: "Verification code from `customers/request-creation-code`."
  - name: name
    type: string
    required: true
    description: "Customer's name."
  - name: identity
    type: string
    description: "Email address or phone number the code was sent to. Defaults to `email`, then `phone`; at least one of the three is required."
  - name: email
    type: string
    description: "Customer email address. Must be unique among the company's customers."
  - name: phone
    type: string
    description: "Customer phone number. Must be unique among the company's customers."
  - name: photo
    type: string
    description: "Profile photo, as a file public ID or a base64 image."
