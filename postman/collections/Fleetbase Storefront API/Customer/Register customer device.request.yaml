$kind: http-request
description: |-
  Registers a device token for the authenticated storefront customer. Use this to enable push notifications for the customer device.
url: "{{base_url}}/{{api_prefix}}/{{namespace}}/customers/register-device"
method: POST
headers:
  - key: Customer-Token
    value: "{{customer_token}}"
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "token": "{{device_token}}",
      "platform": "ios"
    }
order: 5000
