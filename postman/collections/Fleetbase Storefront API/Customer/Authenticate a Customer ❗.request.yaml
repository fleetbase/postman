$kind: http-request
description: |-
  Authenticates a storefront customer with an email or phone identity and password. The response includes the customer profile and an auth token.
url: "{{base_url}}/{{api_prefix}}/{{namespace}}/customers/login"
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "identity": "{{customer_identity}}",
      "password": "{{customer_password}}"
    }
scripts:
  - type: afterResponse
    code: |
      // The customer credential for the rest of this collection. login returns the
      // Sanctum token at the top level (no data envelope), and it is sent back as a
      // Customer-Token header, not as Authorization — that carries the store key.
      var json_response = pm.response.json();
      let cv = pm.environment;
      if (json_response && json_response.token) {
          cv.set("customer_token", json_response.token);
      }
      
      // Requests that address the customer by id use {{customer_id}}; nothing set it.
      cv.set("customer_id", json_response.id);
    language: text/javascript
order: 1000
