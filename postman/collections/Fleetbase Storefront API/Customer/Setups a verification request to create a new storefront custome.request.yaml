$kind: http-request
name: Setups a verification request to create a new storefront customer. ?
description: |-
  Sends a verification code to start a storefront customer sign-up. The code is required when creating the customer account; it expires after ten minutes and can be used once.

  Returns `422` when an account already exists for the identity (send the customer to sign in instead), or when the phone number is invalid or cannot receive a text message. Asking again for the same identity within sixty seconds returns `{ "status": "ok" }` without sending a second message, so a retry button is safe to offer.

  Endpoints that send a text are limited to five requests a minute per storefront key and client address, and every message passes the platform's SMS guard. A refused send returns `429` with a `Retry-After` header (a cooldown on that number, or the store's message budget) or `423` (text messages are paused for the store).
url: "{{base_url}}/{{api_prefix}}/{{namespace}}/customers/request-creation-code"
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "mode": "email",
      "identity": "{{creation_code_identity}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      // The identity must not have an account yet. A contract run supplies one in
      // creation_code_identity. Create a Customer's {{new_customer_identity}} will not do:
      // the newest live code for an identity is the one that counts, and the code seeded
      // for that identity has to stay the newest. Without one, the request is sent for the
      // signed-in customer's own identity and documents the refusal instead.
      if (!pm.environment.get('creation_code_identity')) {
          pm.variables.set('creation_code_identity', pm.environment.get('customer_identity'));
          pm.variables.set('expected_status', 422);
      }
    language: text/javascript
order: 4000
