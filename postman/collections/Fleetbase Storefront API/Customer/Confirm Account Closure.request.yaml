$kind: http-request
description: |-
  Confirms storefront account closure using the verification code sent to the customer. Fleetbase deletes the customer contact and, for customer users, the linked user account.

  The code verifies once and locks after five wrong guesses; after ten wrong codes for the customer within fifteen minutes the endpoint returns `429`.
url: "{{base_url}}/{{api_prefix}}/{{namespace}}/customers/confirm-account-closure"
method: POST
headers:
  - key: Customer-Token
    value: "{{customer_token}}"
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "code": "{{verification_code}}"
    }
order: 8100
