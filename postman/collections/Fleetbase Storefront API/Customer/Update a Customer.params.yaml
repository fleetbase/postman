$kind: params
fields:
  - name: name
    type: string
    description: "Customer's name."
  - name: title
    type: string
    description: "Customer's title."
  - name: email
    type: string
    description: "Customer email address."
  - name: phone
    type: string
    description: "Customer phone number. To change a verified number, use `request-phone-verification` and `verify-phone-number`."
  - name: place
    type: string
    description: "Public ID of one of the customer's places to make it their default address."
  - name: photo
    type: string
    description: "Profile photo, as a file public ID or a base64 image; `REMOVE` deletes it."
  - name: meta
    type: object
    description: "Custom metadata stored on the customer."
