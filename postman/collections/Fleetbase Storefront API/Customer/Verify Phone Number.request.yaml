$kind: http-request
description: |-
  Verifies the customer's pending phone number with the code sent by the phone verification request. The code verifies once and locks after five wrong guesses; after ten wrong codes for the customer within fifteen minutes the endpoint returns `429`.
url: "{{base_url}}/{{api_prefix}}/{{namespace}}/customers/verify-phone-number"
method: POST
headers:
  - key: Customer-Token
    value: "{{customer_token}}"
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "phone": "{{customer_phone}}",
      "code": "{{verification_code}}"
    }
order: 8300
