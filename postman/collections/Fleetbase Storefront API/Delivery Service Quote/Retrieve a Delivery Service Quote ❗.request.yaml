$kind: http-request
description: |-
  Returns a delivery service quote for the supplied cart, origin, and destination. Use the quote's `id` as `service_quote` at checkout to include delivery pricing. Returns a single quote, or an array with `all=1`.

  For a multi-store Network cart the distance is summed leg by leg: from the farthest store, to the nearest next store, then to the customer.

  Errors: `422` with `code: "cart_items_unavailable"` and `items: [{ id, product_id, name }]` when a product in the cart was deleted, made unavailable or unpublished, or a line's food truck or store location no longer exists (show it to the customer and send them back to the cart). `400` for a missing origin or destination, no service rates, or an unknown integrated vendor. `422` when a Network store location is not available in the network.
url: "{{base_url}}/{{api_prefix}}/{{namespace}}/service-quotes/from-cart"
method: GET
queryParams:
  # origin and destination accept a place id, a store_location id, a vehicle id, a
  # food_truck id, or a "lat,lng" pair. Coordinates are shown because that is what a
  # storefront client usually has: the store's position and the customer's address.
  origin: "1.3521,103.8198"
  destination: "1.3644,103.9915"
  cart: "{{cart_id}}"
scripts:
  - type: afterResponse
    code: |-
      // Checkout/Before addresses {{service_quote_id}}; nothing set it.
      //
      // from-cart answers with a SINGLE quote object, not a list — an earlier version of
      // this script only handled an array, so the id was never captured and Before failed
      // with "The service quote field is required." Both shapes are accepted here so a
      // future multi-quote response keeps working.
      var json_response = pm.response.json();
      var quote = Array.isArray(json_response) ? json_response[0] : json_response;

      pm.test("Retrieve a Delivery Service Quote returns a quote", function () {
          pm.expect(quote, "no quote returned").to.be.an('object');
          pm.expect(quote.id, "quote has no id").to.be.a('string').and.not.empty;
      });

      if (quote && quote.id) {
          pm.environment.set("service_quote_id", quote.id);
      }
    language: text/javascript
order: 1000
