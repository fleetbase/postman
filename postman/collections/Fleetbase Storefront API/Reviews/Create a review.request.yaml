$kind: http-request
description: |-
  Creates a verified-purchase review for the authenticated customer. The customer must be allowed to review the subject (see Check Review Eligibility); otherwise the request is refused with `403` and `{ "error": message, "reason": reason }`, using the same reasons. The review is linked to the order it reviews, so it is returned with `"verified": true`.
url: "{{base_url}}/{{api_prefix}}/{{namespace}}/reviews"
method: POST
headers:
  - key: Customer-Token
    value: "{{customer_token}}"
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "subject": "{{store_id}}",
      "content": "Arrived on time and exactly as described.",
      "rating": 5
    }
scripts:
  - type: beforeRequest
    code: |-
      // A customer can only review after a completed order. Unless the environment says
      // the customer has one to review, the request documents the refusal contract.
      if (!pm.environment.get('review_eligible')) {
          pm.variables.set('expected_status', 403);
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      // Retrieve a Store review and Delete a Review both address {{review_id}}.
      var json_response = pm.response.json();
      if (pm.response.code === 403) {
          pm.test('An ineligible customer is told why', function () {
              pm.expect(json_response.reason).to.be.oneOf(['sign_in_required', 'unsupported_subject', 'no_completed_order', 'already_reviewed']);
          });
      } else {
          pm.environment.set("review_id", json_response.id);
      }
    language: text/javascript
order: 2000
