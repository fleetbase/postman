$kind: http-request
description: Create a review
url: "{{base_url}}/{{api_prefix}}/{{namespace}}/reviews"
method: POST
headers:
  - key: Customer-Token
    value: "{{customer_token}}"
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "content": "Arrived on time and exactly as described.",
      "rating": 5
    }
order: 2000
