$kind: params
fields:
  - name: store
    type: string
    description: "Store public ID. Required with a network key (the store must be a member); ignored with a store key."
  - name: limit
    type: string
    description: "Maximum number of reviews to return."
  - name: offset
    type: string
    description: "Number of reviews to skip."
  - name: sort
    type: string
    description: "`newest`, `oldest`, `highest` or `lowest`."
