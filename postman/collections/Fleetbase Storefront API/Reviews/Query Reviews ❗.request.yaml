$kind: http-request
description: |-
  Lists a store's reviews. Send the customer token to have the customer's own review marked with `"is_mine": true`.
url: "{{base_url}}/{{api_prefix}}/{{namespace}}/reviews"
method: GET
headers:
  - key: Customer-Token
    value: "{{customer_token}}"
queryParams:
  store: "{{store_id}}"
  limit: ""
  offset: ""
  sort: ""
order: 1000
