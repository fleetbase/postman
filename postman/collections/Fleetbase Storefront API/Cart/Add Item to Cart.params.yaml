$kind: params
fields:
  - name: quantity
    type: integer
    description: "Quantity of the product to add. Defaults to 1."
  - name: variants
    type: array of objects
    description: "Selected product variant data to store on the cart line item."
  - name: addons
    type: array of objects
    description: "Selected product addon data to store on the cart line item."
  - name: scheduled_at
    type: timestamp
    description: "Scheduled fulfillment time for the line item."
  - name: store_location
    type: string
    description: "Public ID of a location belonging to the product's store, or a food truck ID (`food_truck_…`) to order from that truck, which also sets the line's location. A location from another store returns `400`. Network carts reject cross-store location substitution."
  - name: catalog
    type: string
    description: "Catalog public ID the product is ordered from (for example a food truck's menu). The catalog's price and availability apply; a product that's unavailable in the catalog returns `400`."
