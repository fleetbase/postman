$kind: http-request
description: |-
  Updates a line item already in the cart. Send any of `quantity`, `variants`,
  `addons` or `scheduled_at`; omitted fields are left unchanged. The response
  returns the updated cart.
url: "{{base_url}}/{{api_prefix}}/{{namespace}}/carts/{{cart_id}}/{{line_item_id}}"
method: PUT
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "quantity": 2
    }
order: 3000
