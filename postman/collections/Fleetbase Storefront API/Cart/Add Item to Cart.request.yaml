$kind: http-request
description: |-
  Adds a product to a cart and creates or updates the matching cart line item. Include quantity, variants, addons, scheduling, or store location details when needed.
url: "{{base_url}}/{{api_prefix}}/{{namespace}}/carts/{{cart_id}}/{{product_id}}"
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "addons": [],
      "quantity": 1,
      "variants": []
    }
order: 1000
