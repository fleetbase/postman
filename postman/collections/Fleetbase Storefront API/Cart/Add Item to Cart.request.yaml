$kind: http-request
description: |-
  Adds a product to a cart and creates or updates the matching cart line item. Include quantity, variants, addons, scheduling, or store location details when needed.
url: "{{base_url}}/{{api_prefix}}/{{namespace}}/carts/{{cart_id}}/{{product_id}}"
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "addons": [],
      "quantity": 1,
      "variants": []
    }
scripts:
  - type: afterResponse
    code: |-
      // Update item in Cart and Remove item from cart address {{line_item_id}} —
      // the cart ITEM id (cart_item_*), not the product id. Nothing set it.
      var json_response = pm.response.json();

      if (Array.isArray(json_response.items) && json_response.items.length) {
          pm.environment.set("line_item_id", json_response.items[0].id);
      }
    language: text/javascript
order: 1000
