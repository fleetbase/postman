$kind: object
name: Storefront Order
description: |-
  A storefront order is a FleetOps order created from a captured storefront checkout.
example: |
  {
    "id": "order_9Kx2mQ1",
    "public_id": "order_9Kx2mQ1",
    "status": "created",
    "type": "storefront",
    "payload": null,
    "customer": null,
    "meta": {
      "checkout_id": "checkout_123",
      "storefront": "Acme Market",
      "total": 5150,
      "discount": 500,
      "promotions": [
        { "promotion": "promotion_7Hq2xL9", "name": "Welcome $5 off", "type": "fixed_amount", "code": "WELCOME5", "amount": 500, "delivery_amount": 0 }
      ],
      "currency": "USD"
    },
    "notes": null,
    "created_at": "2026-05-07T09:30:00Z",
    "updated_at": "2026-05-07T09:30:00Z"
  }
fields:
  - name: id
    type: string
    description: "Public identifier of the order."
  - name: public_id
    type: string
    description: "Public identifier of the order."
  - name: status
    type: string
    description: "Order lifecycle status."
  - name: type
    type: string
    description: "Order type, usually `storefront` for orders created by this API."
  - name: payload
    type: object
    description: "FleetOps payload created from the storefront cart."
  - name: customer
    type: object
    description: "Customer associated with the order."
  - name: meta
    type: object
    description: "Storefront checkout, payment, totals, and fulfillment metadata. `discount` is the total promotion discount (minor units) and `promotions` lists the applied promotions with their amounts; multi-store child orders carry their store's share of the item discount."
  - name: notes
    type: string
    description: "Order notes supplied during checkout capture."
  - name: created_at
    type: timestamp
    description: "Time the order was created."
  - name: updated_at
    type: timestamp
    description: "Time the order was last updated."
