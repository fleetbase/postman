$kind: http-request
description: |-
  The store the storefront key belongs to (with a network key, the network), as a Store object. It includes the store's clock: `timezone` and `utc_offset`, its current offset from UTC in minutes. Store hours (from its locations), product hours and booked times are wall-clock times in that zone, so read them on the store's clock (`UTC + utc_offset`) rather than the device's.
url: "{{base_url}}/{{api_prefix}}/{{namespace}}/about"
method: GET
scripts:
  - type: afterResponse
    code: |
      // Lookup Store addresses {{store_id}}; nothing set it.
      var json_response = pm.response.json();
      let cv = pm.environment;
      cv.set("store_id", json_response.id);
    language: text/javascript
order: 2000
